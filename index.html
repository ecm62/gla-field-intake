<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e8eef6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Field Daily Log</title>
  <style>
    :root {
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --tile-gp: #ede7f6;
      --tile-gp-b: #b39ddb;
      --tile-ps: #e8f5e9;
      --tile-ps-b: #81c784;
      --tile-gest: #e0f2f1;
      --tile-gest-b: #80cbc4;
      --tile-farr: #ffebee;
      --tile-farr-b: #ef9a9a;
      --tile-nurs: #fffde7;
      --tile-nurs-b: #fff176;
      --tile-pork: #eceff1;
      --tile-pork-b: #b0bec5;
      --tile-boar: #cfd8dc;
      --tile-boar-b: #90a4ae;
      --tile-gdu: #f3e5f5;
      --tile-gdu-b: #ce93d8;
      --tile-exit: #fff3e0;
      --tile-exit-b: #ffcc80;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      padding: 8px 24px 70px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #e8eef6 0%, #f7f9fc 100%);
      color: var(--text-primary);
      font-size: 15px;
      min-height: 100vh;
    }

    /* 側邊細長條 + 放大 2.5 倍左右三角形 */
    .edge-rail {
      position: fixed;
      top: 0;
      bottom: 54px;
      width: 22px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.04);
      cursor: pointer;
    }
    .edge-rail:active { background: rgba(2, 132, 199, 0.18); }
    .edge-rail.left { left: 0; }
    .edge-rail.right { right: 0; }

    .tri-big {
      width: 0;
      height: 0;
      opacity: 0.38;
    }
    .edge-rail:active .tri-big { opacity: 0.88; }
    .tri-left {
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-right: 16px solid #1e293b;
    }
    .tri-right {
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 16px solid #1e293b;
    }

    /* 頂部操作列 */
    .top-bar {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 8px auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pill-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .home-house-btn {
      border: 1.5px solid #0284c7;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .worker-inp {
      border: 1px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 700;
      width: 112px;
    }

    /* 分離式天氣與時間預報小框 */
    .split-widget-wrap {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 10px auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .mini-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .sub-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 9px 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .clock-val {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
    }

    .date-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .loc-val {
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.25;
    }

    .temp-val {
      font-size: 18px;
      font-weight: 800;
      color: #0369a1;
    }

    .rain-txt {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-top: 2px;
    }

    .curve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 3px;
    }

    .span-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 登入框 */
    .auth-card {
      width: 100%;
      max-width: 400px;
      margin: 18px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #1e293b;
    }

    .field-hint {
      font-size: 12px;
      font-weight: 600;
      color: #0369a1;
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .input-box {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
    }

    .primary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      background: #0284c7;
      color: #ffffff;
      cursor: pointer;
    }

    .secondary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      border: 1.5px solid #0284c7;
      border-radius: 14px;
      background: #f0f9ff;
      color: #0369a1;
      cursor: pointer;
    }

    .main-wrap {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    /* GP 跨部門快捷切換列 */
    .gp-quick-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    /* PS 房號快速切換列 */
    .room-quick-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .context-bar {
      background: #ffffff;
      border: 1px solid #bae6fd;
      border-radius: 14px;
      padding: 8px 11px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .batch-chip {
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 三週次批次三個小框 */
    .batch-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .batch-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
    }

    .batch-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }

    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .step-btn {
      width: 24px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 0;
      cursor: pointer;
    }

    .batch-inp {
      width: 42px;
      height: 30px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #fff;
      padding: 0;
    }

    /* 動態磚網格 */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @keyframes softFlip {
      0% { transform: perspective(600px) rotateX(0deg); }
      45% { transform: perspective(600px) rotateX(12deg); }
      100% { transform: perspective(600px) rotateX(0deg); }
    }

    .live-tile {
      border-radius: 18px;
      padding: 11px 11px;
      min-height: 82px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid transparent;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.12s ease;
      user-select: none;
    }

    .live-tile:active { transform: scale(0.96); }
    .live-tile.flipping { animation: softFlip 0.65s ease; }
    .live-tile.wide { grid-column: span 2; }

    .tile-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      color: #0f172a;
      word-break: break-word;
    }

    .tile-sub {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-top: 4px;
      line-height: 1.25;
    }

    .tile-badge {
      align-self: flex-end;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #1e293b;
      margin-top: 6px;
    }

    .t-gp { background: var(--tile-gp); border-color: var(--tile-gp-b); }
    .t-ps { background: var(--tile-ps); border-color: var(--tile-ps-b); }
    .t-gest { background: var(--tile-gest); border-color: var(--tile-gest-b); }
    .t-farr { background: var(--tile-farr); border-color: var(--tile-farr-b); }
    .t-nurs { background: var(--tile-nurs); border-color: var(--tile-nurs-b); }
    .t-pork { background: var(--tile-pork); border-color: var(--tile-pork-b); }
    .t-boar { background: var(--tile-boar); border-color: var(--tile-boar-b); }
    .t-gdu { background: var(--tile-gdu); border-color: var(--tile-gdu-b); }
    .t-exit { background: var(--tile-exit); border-color: var(--tile-exit-b); }

    .section-gap { height: 18px; }
    .sec-title {
      font-size: 15px;
      font-weight: 800;
      margin: 4px 0 7px 2px;
      color: #1e293b;
    }

    .panel-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }

    .field-block { margin-bottom: 11px; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }

    .chip-btn.selected {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    /* 待送出購物車清單 */
    .cart-list-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 13px;
      font-weight: 700;
    }
    .cart-item:last-child { border-bottom: none; }
    .del-mini-btn {
      border: 1px solid #fca5a5;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 左右對稱日報總結卡片 */
    .diary-report-card {
      margin-top: 12px;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 16px;
      padding: 12px;
    }
    .diary-top-dt {
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      color: #0f172a;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .diary-sym-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .diary-cell {
      border-radius: 10px;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      color: #64748b;
      font-size: 11px;
      line-height: 1.3;
    }
    .diary-cell.active-zone {
      border: 2px solid #0f172a;
      color: #0f172a;
      font-weight: 800;
    }
    .diary-cell-title {
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 2px;
    }
    .diary-footer-sign {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 2px solid #0f172a;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
    }

    .stage-tracker {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      font-weight: 800;
    }
    .stage-tracker.st-prep { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; }
    .stage-tracker.st-sending { background: #fef9c3; border-color: #facc15; color: #854d0e; }
    .stage-tracker.st-done { background: #dcfce7; border-color: #4ade80; color: #166534; }
    .stage-tracker.st-queued { background: #ffedd5; border-color: #fb923c; color: #9a3412; }
    .stage-tracker.st-err { background: #fee2e2; border-color: #f87171; color: #991b1b; }

    .notice-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      white-space: pre-wrap;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding: 0 18px;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="edge-rail left" onclick="goPrev()">
    <div class="tri-big tri-left"></div>
  </div>
  <div class="edge-rail right" onclick="goNext()">
    <div class="tri-big tri-right"></div>
  </div>

  <!-- 頂部：小房子回首頁 + 填報員姓名 + 語系 BM/EN/中 + 音效 + 重新載入 -->
  <div class="top-bar">
    <div class="pill-group">
      <button type="button" class="home-house-btn" id="btnHomeHouse" onclick="goHomeHouse()" title="Home">🏠</button>
      <input type="text" id="workerNameInput" class="worker-inp" onchange="saveWorkerName(this.value)" />
      <button type="button" class="pill-btn" data-lang="ms" onclick="setLang('ms')">BM</button>
      <button type="button" class="pill-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="pill-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">中</button>
    </div>
    <div class="pill-group">
      <button type="button" class="pill-btn active" id="btnSoundToggle" onclick="toggleSound()"></button>
      <button type="button" class="pill-btn" id="btnReload" onclick="reloadApp()"></button>
      <span id="queuePill" class="pill-btn hidden" style="background:#f59e0b; color:#fff; border-color:#f59e0b;" onclick="syncOfflineQueue()">0</span>
    </div>
  </div>

  <!-- 分離式時鐘、地點、現有溫度與未來預報曲線框 -->
  <section class="split-widget-wrap">
    <div class="mini-row-2">
      <div class="sub-box">
        <div class="clock-val" id="clockNow">--:--:--</div>
        <div class="date-sub" id="dateSub">--</div>
      </div>
      <div class="sub-box">
        <div class="loc-val" id="locSub">--</div>
        <div class="date-sub" id="groupStatusSub">-</div>
      </div>
    </div>

    <div class="mini-row-2">
      <div class="sub-box">
        <div class="temp-val" id="tempNowVal">--°C</div>
        <div class="rain-txt" id="rainNowTxt">--</div>
      </div>
      <div class="sub-box">
        <div class="curve-header">
          <span id="curveTitle"></span>
          <button type="button" class="span-btn" id="btnSpanToggle" onclick="toggleSpan()">±3H / ±6H</button>
        </div>
        <svg id="forecastCurveSvg" viewBox="0 0 240 52" width="100%" height="52"></svg>
      </div>
    </div>
  </section>

  <!-- 密碼驗證框（零暗示） -->
  <section id="loginCard" class="auth-card">
    <label class="field-label" id="lblPass" for="inpPass"></label>
    <input type="password" id="inpPass" class="input-box" autocomplete="off" onkeydown="if(event.key==='Enter') submitLogin();" />
    <button type="button" class="primary-btn" id="btnLogin" onclick="submitLogin()"></button>
    <div id="errLogin" class="notice-box hidden" style="background:#fee2e2; color:#991b1b;"></div>
  </section>

  <!-- 主工作區 -->
  <main id="workspaceMain" class="main-wrap hidden">
    <!-- GP 跨部門快捷切換列 -->
    <div id="gpQuickStrip" class="gp-quick-strip hidden"></div>
    <!-- PS 同部門房號快速跳轉列（如 Nursery 1 跳 Nursery 2） -->
    <div id="roomQuickStrip" class="room-quick-strip hidden"></div>

    <div class="context-bar">
      <span id="locBannerText">-</span>
      <span id="batchBannerBtn" class="batch-chip hidden" onclick="reopenBatchGate()"></span>
    </div>

    <div id="topGrid" class="tile-grid"></div>
    <div class="section-gap"></div>
    <div id="bottomTitle" class="sec-title hidden"></div>
    <div id="bottomGrid" class="tile-grid"></div>

    <div id="formPanel" class="panel-card hidden"></div>
    <div id="diaryPanel" class="panel-card hidden"></div>
    <div id="extraPanel" class="panel-card hidden"></div>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn" id="btnNavPrev" onclick="goPrev()"></button>
    <button type="button" class="nav-btn" id="btnNavNext" onclick="goNext()"></button>
  </nav>

  <script>
    const CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycbyEod8PcLLZYsglmyef9s3AHkzD4gpitKXQDew1YS6fqhlofZp43_iA9uw1SwQzzXiqRg/exec',
      API_TOKEN: 'GLA_FIELD_INTAKE_TOKEN_2026',
      PASSWORDS: {
        ps_basic: 'gla8888',
        ps_query: 'gla9999',
        ps_report: '510067',
        gp_basic: 'gp2222',
        gp_query: 'gp3333',
        admin: 'qwert'
      },
      KEYS: {
        LANG: 'gla_sys_lang_v8',
        PASS: 'gla_sys_pass_v8',
        WORKER: 'gla_worker_name_v8',
        QUEUE: 'gla_sys_queue_v8',
        ROOM_BATCHES: 'gla_room_batches_v8',
        SOUND: 'gla_sound_on_v8'
      },
      LAT: 1.167,
      LON: 110.566,
      MAX_IMG_PX: 800,
      IMG_QUALITY: 0.65
    };

    const DICT = {
      'ms': {
        passLabel: 'Kod Akses',
        enterBtn: 'Masuk',
        reloadBtn: 'Muat Semula',
        soundOn: 'Bunyi: ON',
        soundOff: 'Bunyi: OFF',
        workerPlaceholder: 'Nama Anda',
        badPass: 'Kod akses tidak sah',
        prevBtn: 'Kembali',
        nextBtn: 'Seterusnya',
        locationName: 'Serian · Kuching',
        curveAroundNow3: 'Ramalan ±3 Jam',
        curveAroundNow6: 'Ramalan ±6 Jam',
        nowLabel: 'Kini',
        rainLikely: 'Dijangka Hujan',

    function unlockAudioContext() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!state.audioCtx) state.audioCtx = new AudioCtx();
        if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
      } catch (e) {}
    }

    function playTone(type) {
      if (!state.soundOn) return;
      unlockAudioContext();
      try {
        const ctx = state.audioCtx;
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880.0, now + 0.12);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'step') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660.0, now);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.15);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220.0, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.29);
        }
      } catch (e) {}
    }

    function detectSystemLang() {
      const saved = localStorage.getItem(CONFIG.KEYS.LANG);
      if (saved && DICT[saved]) return saved;
      const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'ms'];
      for (const item of list) {
        const low = String(item).toLowerCase();
        if (low.startsWith('ms') || low.includes('may') || low.includes('my')) return 'ms';
        if (low.startsWith('en')) return 'en';
        if (low.startsWith('zh')) return 'zh-TW';
      }
      return 'ms';
    }

    function sendTelemetryBeacon(eventName, targetArea) {
      if (!state.profile) return;
      const dwell = Math.max(1, Math.round((Date.now() - state.stageStartMs) / 1000));
      state.stageStartMs = Date.now();
      const body = JSON.stringify({
        token: CONFIG.API_TOKEN,
        action: 'telemetry',
        meta: {
          worker_name: state.workerName || 'Unnamed',
          role_level: state.profile.level,
          event_name: eventName,
          target_area: targetArea,
          dwell_seconds: dwell,
          trajectory_summary: state.trajectory.slice(-10).join(' -> '),
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height
        }
      });
      fetch(CONFIG.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body
      }).catch(() => {});
    }

      if (p === CONFIG.PASSWORDS.ps_query) return { group: 'PS', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.ps_report) return { group: 'PS', level: 'report', code: p };
      if (p === CONFIG.PASSWORDS.gp_basic) return { group: 'GP', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.gp_query) return { group: 'GP', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.admin) return { group: 'PS', level: 'admin', code: p };
      return null;
    }

    function updateClockAndForecastCurve() {
      const t = DICT[state.lang];
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const curH = now.getHours();
      const curM = now.getMinutes();

      document.getElementById('clockNow').textContent = `${pad(curH)}:${pad(curM)}:${pad(now.getSeconds())}`;
      document.getElementById('dateSub').textContent = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      document.getElementById('locSub').textContent = state.profile
        ? `${t.locationName} (${state.profile.group})`
        : t.locationName;

      const curTemp = state.hourly24[curH] !== undefined ? state.hourly24[curH] : 29;
      document.getElementById('tempNowVal').textContent = curTemp + '°C';
      document.getElementById('rainNowTxt').textContent =
        (state.rainProbMax >= 50 ? t.rainLikely : t.rainLow) + ` (${state.rainProbMax}%)`;

      const k = state.halfSpan;
      const points = [];
      for (let offset = -k; offset <= k; offset++) {
        const hIdx = Math.max(0, Math.min(23, curH + offset));
        points.push({ offset, hour: hIdx, temp: state.hourly24[hIdx] ?? curTemp });
      }

      const temps = points.map(p => p.temp);
      const minT = Math.min(...temps) - 1;
      const maxT = Math.max(...temps) + 1;

      const coords = points.map((pt, idx) => {
        const x = 14 + (idx / Math.max(1, points.length - 1)) * 212;
        const y = 38 - ((pt.temp - minT) / Math.max(1, maxT - minT)) * 24;
        return { x, y, hour: pt.hour, temp: pt.temp };
      });

      const centerPt = coords[Math.floor(coords.length / 2)];
      const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
      const areaPath = linePath + ` L${coords[coords.length - 1].x.toFixed(1)},43 L${coords[0].x.toFixed(1)},43 Z`;

      const svg = document.getElementById('forecastCurveSvg');
      svg.innerHTML = `
        <defs>
          <linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#fcGrad)"></path>
        <path d="${linePath}" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"></path>
        ${coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.2" fill="#0369a1"></circle>`).join('')}
        <line x1="${centerPt.x.toFixed(1)}" y1="4" x2="${centerPt.x.toFixed(1)}" y2="45" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="2.5,2"></line>
        <circle cx="${centerPt.x.toFixed(1)}" cy="${centerPt.y.toFixed(1)}" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.4"></circle>
        <text x="${centerPt.x.toFixed(1)}" y="10" text-anchor="middle" font-size="8.5" font-weight="800" fill="#dc2626">${t.nowLabel} ${curTemp}°</text>
        <text x="12" y="51" font-size="8" fill="#64748b">${pad(coords[0].hour)}:00</text>
        <text x="${centerPt.x.toFixed(1)}" y="51" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">${pad(curH)}:00</text>
        <text x="228" y="51" text-anchor="end" font-size="8" fill="#0369a1">${pad(coords[coords.length - 1].hour)}:00</text>
      `;
    }

    async function loadForecastWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FKuching&forecast_days=1`;
        const res = await fetch(url);
        const j = await res.json();
        if (j && j.hourly && Array.isArray(j.hourly.temperature_2m)) {
          state.hourly24 = j.hourly.temperature_2m.slice(0, 24).map(v => Math.round(v));
          const probs = j.hourly.precipitation_probability || [];
          state.rainProbMax = probs.length ? Math.max(...probs.slice(0, 24)) : 0;
          updateClockAndForecastCurve();
        }
      } catch (e) {}
    }

        const bStr = [state.currentBatch.w1, state.currentBatch.w2, state.currentBatch.w3].filter(Boolean).join('/');
        batchChip.textContent = (bStr ? `${bStr} · ` : '') + t.tapToChangeBatch;
        batchChip.classList.remove('hidden');
      } else {
        batchChip.classList.add('hidden');
      }

      if (['query', 'report', 'admin'].includes(state.profile.level)) {
        botTitle.classList.remove('hidden');
        botGrid.appendChild(makeTile(t.deptFarr, t.extraHeading, 'A1', 't-farr', false, () => {
          sendTelemetryBeacon('OPEN_ANALYSIS_TILE', 'Farrowing_Analysis');
          showExtra('Farrowing Analytics');
        }));
        botGrid.appendChild(makeTile(t.extraHeading, state.profile.group, 'Q1', 't-gp', false, () => {
          sendTelemetryBeacon('OPEN_QUERY_TILE', 'Sow_Boar_Lookup');
          renderQueryBox();
        }));
        if (state.profile.level === 'admin') {
          botGrid.appendChild(makeTile('Telemetry', 'Admin', 'SYS', 't-boar', true, () => {
            loadAdminTelemetry();
          }));
        }
      } else {
        botTitle.classList.add('hidden');
      }

      if (state.view.stage === 'depts') {
        const depts = [
          { id: 'Boar House', title: t.deptBoar, sub: t.deptBoarSub, cls: 't-boar', wide: false },
          { id: 'GDU', title: t.deptGdu, sub: t.deptGduSub, cls: 't-gdu', wide: false },
          { id: 'Gestation', title: t.deptGest, sub: t.deptGestSub, cls: 't-gest', wide: false },
          { id: 'Farrowing', title: t.deptFarr, sub: t.deptFarrSub, cls: 't-farr', wide: false },
          { id: 'Nursery', title: t.deptNurs, sub: t.deptNursSub, cls: 't-nurs', wide: false },
          { id: 'Porker', title: t.deptPork, sub: t.deptPorkSub, cls: 't-pork', wide: false },
          { id: 'Exit', title: t.deptExit, sub: t.deptExitSub, cls: 't-exit', wide: true }
        ];
        depts.forEach(d => {
          topGrid.appendChild(makeTile(d.title, d.sub, state.profile.group, d.cls, d.wide, () => {
            pushHist();
            state.queuedRecords = [];
            state.view.dept = d.id;
            state.view.wing = '';
            state.view.room = '';
            logTraj('dept:' + d.id);
            sendTelemetryBeacon('ENTER_DEPT', d.id);

            if (d.id === 'Exit') {
              state.view.room = 'Exit';
              state.view.formType = 'exit_sales';
              state.view.stage = 'form';
              renderView();
              return;
            }
            if (d.id === 'GDU') {
              const curW = isoWeek(new Date());
              state.currentBatch = { w1: String(curW), w2: String(wrap52(curW + 16)), w3: String(wrap52(curW + 19)) };
              if (state.profile.group === 'GP') {
                state.view.room = 'GDU';
                state.view.stage = 'room_tiles';
              } else {
                state.view.stage = 'room';
              }
              renderView();
              return;
            }
            if (state.profile.group === 'PS' && ['Gestation', 'Farrowing', 'Nursery', 'Porker'].includes(d.id)) {
              state.view.stage = 'wing';
              renderView();
              return;
            }
            state.view.room = d.id;
            enterBatchGate();
          }));
        });
        runTileFlip();
        return;
      }

      if (state.view.stage === 'wing') {
        const cls = deptCls(state.view.dept);
        [{ code: 'A', label: t.sideA }, { code: 'B', label: t.sideB }].forEach(w => {
          topGrid.appendChild(makeTile(w.label, state.view.dept, w.code, cls, false, () => {
            pushHist();
            state.view.wing = w.code;
            logTraj('wing:' + w.code);
            if (['Farrowing', 'Nursery', 'Porker'].includes(state.view.dept)) {
              state.view.stage = 'room';
            } else {
              state.view.room = 'Gestation ' + w.code;
              enterBatchGate();
              return;
            }
            renderView();
          }));
        });
        runTileFlip();
        return;
      }

      if (state.view.stage === 'room') {
        const cls = deptCls(state.view.dept);
        const rooms = getRoomsForDept(state.view.dept, state.view.wing);
        rooms.forEach(r => {
          topGrid.appendChild(makeTile(r, state.view.dept, r, cls, false, () => {
            pushHist();
            state.queuedRecords = [];
            state.view.room = r;
            logTraj('room:' + r);
            sendTelemetryBeacon('SELECT_ROOM', r);
            if (state.view.dept === 'GDU') {
              const curW = isoWeek(new Date());
              state.currentBatch = { w1: String(curW), w2: String(wrap52(curW + 16)), w3: String(wrap52(curW + 19)) };
              state.view.stage = 'room_tiles';
              renderView();
            } else {
              enterBatchGate();
            }
          }));
        });
        runTileFlip();
        return;
      }

      if (state.view.stage === 'batch_gate') {
        renderBatchGate(formPanel);
        return;
      }

      if (state.view.stage === 'room_tiles') {
        renderRoomTiles(topGrid);
        runTileFlip();
        return;
      }

      if (state.view.stage === 'form') {
        renderForm(formPanel);
      }
    }

    function enterBatchGate() {
      const saved = loadSavedBatch();
      state.currentBatch = saved && saved.w1 ? saved : { w1: '', w2: '', w3: '' };
      state.view.stage = 'batch_gate';
      renderView();

    function renderBatchGate(panel) {
      const t = DICT[state.lang];
      panel.classList.remove('hidden');
      const curW = isoWeek(new Date());
      const def1 = state.currentBatch.w1 || curW;
      const def2 = state.currentBatch.w2 || wrap52(Number(def1) + 16);
      const def3 = state.currentBatch.w3 || wrap52(Number(def1) + 19);

      panel.innerHTML = `
        <div class="sec-title">${t.batchGateTitle}</div>
        <div class="field-hint">${[state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' › ')} · ${t.batchRemind}</div>
        <div class="batch-trio">
          <div class="batch-box">
            <label>${t.w1Label}</label>
            <div class="stepper-row">
              <button type="button" class="step-btn" onclick="stepW(1,-1)">-</button>
              <input type="number" id="bw1" class="batch-inp" min="1" max="52" value="${def1}" onchange="syncW2W3()" />
              <button type="button" class="step-btn" onclick="stepW(1,1)">+</button>
            </div>
          </div>
          <div class="batch-box">
            <label>${t.w2Label}</label>
            <div class="stepper-row">
              <button type="button" class="step-btn" onclick="stepW(2,-1)">-</button>
              <input type="number" id="bw2" class="batch-inp" min="1" max="52" value="${def2}" />
              <button type="button" class="step-btn" onclick="stepW(2,1)">+</button>
            </div>
          </div>
          <div class="batch-box">
            <label>${t.w3Label}</label>
            <div class="stepper-row">
              <button type="button" class="step-btn" onclick="stepW(3,-1)">-</button>
              <input type="number" id="bw3" class="batch-inp" min="1" max="52" value="${def3}" />
              <button type="button" class="step-btn" onclick="stepW(3,1)">+</button>
            </div>
          </div>
        </div>
        <button type="button" class="primary-btn" onclick="confirmBatch()">${t.confirmBatchBtn}</button>
      `;
    }

    function wrap52(n) {
      return ((n - 1) % 52 + 52) % 52 + 1;
    }

    function isoWeek(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.min(52, Math.ceil((((date - yearStart) / 86400000) + 1) / 7));
    }

    function stepW(idx, delta) {
      const el = document.getElementById('bw' + idx);
      el.value = wrap52((parseInt(el.value, 10) || 1) + delta);
      if (idx === 1) syncW2W3();
    }

    function syncW2W3() {
      const w1 = parseInt(document.getElementById('bw1').value, 10) || 1;
      document.getElementById('bw2').value = wrap52(w1 + 16);
      document.getElementById('bw3').value = wrap52(w1 + 19);
    }

      const w1 = document.getElementById('bw1').value.trim();

      const w3 = document.getElementById('bw3').value.trim();

      saveBatch(state.currentBatch);

      return {

    function makeTile(title, sub, badge, cls, wide, onClick) {
      const div = document.createElement('div');
      div.className = 'live-tile ' + cls + (wide ? ' wide' : '');
      div.innerHTML = `
        <div>
          <div class="tile-title">${title}</div>
          <div class="tile-sub">${sub}</div>

      div.addEventListener('click', onClick);
      return div;

    function runTileFlip() {
      const tiles = document.querySelectorAll('#topGrid .live-tile');
      tiles.forEach((el, idx) => {
        setTimeout(() => {
          setInterval(() => {
            el.classList.add('flipping');
            setTimeout(() => el.classList.remove('flipping'), 680);
          }, 4200 + idx * 420);
        }, idx * 260);
      });
    }

    async function execQuery() {
      const ear = document.getElementById('qEarInp').value.trim();
      const out = document.getElementById('qOutBox');
      out.classList.remove('hidden');
      out.textContent = '...';
      try {
        const url = `${CONFIG.GAS_URL}?action=query&token=${encodeURIComponent(CONFIG.API_TOKEN)}&pass=${encodeURIComponent(state.profile.code)}&category=${encodeURIComponent(state.qCat)}&ear_tag=${encodeURIComponent(ear)}&worker_name=${encodeURIComponent(state.workerName)}`;
        const r = await fetch(url);
        const j = await r.json();
        out.textContent = j.ok ? JSON.stringify(j.data, null, 2) : (j.error || 'ERR');
      } catch (e) {
        out.textContent = String(e);
      }
    }

    async function loadAdminTelemetry() {
      const p = document.getElementById('extraPanel');
      p.classList.remove('hidden');
      p.innerHTML = '<div class="notice-box">...</div>';
      try {
        const url = `${CONFIG.GAS_URL}?action=telemetry_read&token=${encodeURIComponent(CONFIG.API_TOKEN)}&pass=${encodeURIComponent(state.profile.code)}`;
        const r = await fetch(url);
        const j = await r.json();
        p.innerHTML = `<div class="notice-box">${j.ok ? JSON.stringify(j.data, null, 2) : (j.error || 'ERR')}</div>`;
      } catch (e) {
        p.innerHTML = `<div class="notice-box">${String(e)}</div>`;
      }

    function chips(key, opts, multi) {
      state.chips[key] = multi ? [] : '';
      let h = '<div class="chip-row">';
      opts.forEach(o => {
        const v = typeof o === 'object' ? o.v : o;
        const l = typeof o === 'object' ? o.l : o;
        h += `<button type="button" class="chip-btn" data-g="${key}" data-v="${v}" data-m="${multi ? '1' : '0'}" onclick="toggleChip(this)">${l}</button>`;
      });
      h += '</div>';
      return h;
    }

    function toggleChip(btn) {
      const g = btn.dataset.g;
      const v = btn.dataset.v;
      const m = btn.dataset.m === '1';
      if (m) {
        btn.classList.toggle('selected');
        const arr = state.chips[g] || [];
        const i = arr.indexOf(v);
        if (i >= 0) arr.splice(i, 1);
        else arr.push(v);
        state.chips[g] = arr;
      } else {
        document.querySelectorAll(`.chip-btn[data-g="${g}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.chips[g] = v;
      }
    }

    // 強制多耳號必須用逗號 (,) 或句點 (.) 分隔，禁止只用空格分隔
    function validateMultiEarString(rawStr) {
      const s = String(rawStr || '').trim();
      if (!s) return true;
      if (/\s+/.test(s) && !s.includes(',') && !s.includes('.')) {
        return false;
      }
      return true;
    }

    async function collectCurrentFormItem() {
      const t = DICT[state.lang];
      const data = {};
      document.querySelectorAll('#formPanel [id^="f_"]').forEach(el => {
        if (el.type === 'file') return;
        data[el.id.replace(/^f_/, '')] = el.value;
      });
      Object.keys(state.chips).forEach(k => { data[k] = state.chips[k]; });

      const multiFields = ['ear_tags_list', 'deferred_sow_tags'];
      for (const mf of multiFields) {
        if (data[mf] && !validateMultiEarString(data[mf])) {
          alert(t.errCommaDot);
          playTone('error');
          return null;
        }
      }

      if (state.view.formType === 'gestation' && data.breeding_date) {
        const nowTime = new Date().toTimeString().slice(0, 8);
        data.breeding_datetime_hidden = `${data.breeding_date} ${nowTime}`;
      }
      if (state.view.formType.startsWith('farr_')) {
        data.sub_action = state.view.formType;
      }
      if (state.view.formType === 'treatment' || state.view.formType === 'mortality') {
        data.event_type = state.view.formType;
      }

      let photo = null;
      const photoInput = document.getElementById('f_photo_file');
      if (photoInput && photoInput.files && photoInput.files[0]) {
        photo = await compressPhoto(photoInput.files[0]);
      }

      return { data, photo };
    }

    function hasAnyInputData(dataObj) {
      const ignoreKeys = new Set(['record_date', 'wean_date', 'collection_date', 'test_date']);
      return Object.keys(dataObj).some(k => {
        if (ignoreKeys.has(k)) return false;
        const v = dataObj[k];
        if (Array.isArray(v)) return v.length > 0;
        return String(v || '').trim() !== '';
      });
    }

    async function addNextEntryToQueue() {
      const item = await collectCurrentFormItem();
      if (!item) return;
      if (!hasAnyInputData(item.data)) return;

      state.queuedRecords.push(item);
      playTone('step');
      logTraj('add_next:' + state.queuedRecords.length);

      document.querySelectorAll('#formPanel [id^="f_"]').forEach(el => {
        if (el.type === 'date') return;
        if (el.type === 'file') { el.value = ''; return; }
        el.value = '';
      });
      document.querySelectorAll('#formPanel .chip-btn.selected').forEach(b => b.classList.remove('selected'));
      Object.keys(state.chips).forEach(k => {
        state.chips[k] = Array.isArray(state.chips[k]) ? [] : '';
      });

      refreshCartUI();
    }

    function removeQueuedItem(idx) {
      state.queuedRecords.splice(idx, 1);
      refreshCartUI();
    }

    function refreshCartUI() {
      const t = DICT[state.lang];
      const box = document.getElementById('queuedCartBox');
      if (!box) return;
      if (state.queuedRecords.length === 0) {
        box.classList.add('hidden');
        return;
      }
      box.classList.remove('hidden');
      box.innerHTML = `<div style="font-size:13px; font-weight:800;">${t.queuedListTitle} (${state.queuedRecords.length})</div>` +

          return `<div class="cart-item"><span>#${i + 1} · ${label}</span><button type="button" class="del-mini-btn" onclick="removeQueuedItem(${i})">${t.delBtn}</button></div>`;
        }).join('');

    function setStageUI(el, cls, text) {
      el.className = 'stage-tracker ' + cls;
      el.classList.remove('hidden');
      el.textContent = text;
    }

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const maxDim = CONFIG.MAX_IMG_PX;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mimeType: 'image/jpeg', base64: c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY) });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function submitAllQueuedAndCurrent() {
      const t = DICT[state.lang];
      if (!state.workerName) {
        alert(t.errNoName);
        document.getElementById('workerNameInput').focus();
        playTone('error');
        return;
      }

      const currentItem = await collectCurrentFormItem();
      if (!currentItem) return;

      const allToSend = [...state.queuedRecords];
      if (hasAnyInputData(currentItem.data)) {
        allToSend.push(currentItem);
      }
      if (allToSend.length === 0) return;

      const btn = document.getElementById('btnSendForm');
      const stEl = document.getElementById('stageTracker');
      btn.disabled = true;
      setStageUI(stEl, 'st-prep', t.step1Prep);

      const ft = state.view.formType;
      let backendModule = 'daily_fw';
      if (ft === 'daily_fw') backendModule = 'daily_fw';
      else if (ft === 'conformation') backendModule = 'conformation';
      else if (ft === 'gestation') backendModule = 'gestation';
      else if (ft.startsWith('farr_')) backendModule = 'farrowing';
      else if (ft === 'boar_semen') backendModule = 'boar_semen';
      else if (ft === 'malformation') backendModule = 'malformation_disease';
      else if (ft === 'treatment' || ft === 'mortality') backendModule = 'treatment_mortality';
      else if (ft === 'exit_sales') backendModule = 'exit_sales';

      setStageUI(stEl, 'st-sending', t.step2Send);
      logTraj('submit_batch:' + backendModule + 'x' + allToSend.length);

      const payload = {
        token: CONFIG.API_TOKEN,
        module: backendModule,
        common: {
          farm_mode: state.profile.group,
          wing: state.view.wing,
          room: state.view.room,
          location: [state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' / '),
          batch: state.currentBatch,
          module: backendModule
        },
        records: allToSend,
        meta: {
          worker_name: state.workerName,
          entered_at: state.enteredAt,
          submitted_at: new Date().toISOString(),
          dwell_seconds: Math.max(1, Math.round((Date.now() - state.enteredMs) / 1000)),
          ui_lang: state.lang,
          role_level: state.profile.level,
          device_summary: /mobile|android|iphone|ipad/i.test(navigator.userAgent) ? 'Mobile/Tablet' : 'Desktop',
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height + '@' + (window.devicePixelRatio || 1),
          trajectory_summary: state.trajectory.join(' -> '),
          offline_queued: false
        }
      };

      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const j = await res.json();
        if (j && j.ok) {
          setStageUI(stEl, 'st-done', t.step3Done + (j.rowId || 'OK') + ` (${allToSend.length})`);
          playTone('success');
          state.queuedRecords = [];
          refreshCartUI();
          renderSymmetricalDiaryReport(allToSend, backendModule);
        } else {
          throw new Error(j && j.error ? j.error : 'ERR');
        }
      } catch (e) {
        payload.meta.offline_queued = true;
        const q = getQueue();
        q.push(payload);
        localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(q));
        refreshQueuePill();
        setStageUI(stEl, 'st-queued', t.step3Queued);
        playTone('step');
        renderSymmetricalDiaryReport(allToSend, backendModule);
      }
      btn.disabled = false;
    }

    // 左右對稱建築日報總結卡片 + 下載 YYYYMMDD Room diary report.png
    function renderSymmetricalDiaryReport(records, mod) {
      const t = DICT[state.lang];
      const diaryPanel = document.getElementById('diaryPanel');
      diaryPanel.classList.remove('hidden');

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const ymd = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
      const displayDt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

      let waterM3 = 0, waterL = 0, feedBags = 0, feedKg = 0, headCnt = 0, mortCnt = 0;
      const mortTags = [];
      records.forEach(r => {
        const d = r.data || {};
        const am = parseFloat(d.water_meter_am);
        const pm = parseFloat(d.water_meter_pm);
        if (!isNaN(am) && !isNaN(pm) && pm >= am) {
          waterM3 += (pm - am);
          waterL += (pm - am) * 1000;
        }
        const bags = parseFloat(d.feed_bags);
        if (!isNaN(bags)) {
          feedBags += bags;
          feedKg += bags * 50;
        }
        const hc = parseInt(d.head_count, 10);
        if (!isNaN(hc)) headCnt += hc;
        if (d.event_type === 'mortality' || d.exit_reason === 'Mortality') {
          const ac = parseInt(d.affected_count || d.head_count || '1', 10) || 1;
          mortCnt += ac;
          if (d.ear_tags_list) mortTags.push(d.ear_tags_list);
        }
      });

      const activeKey = `${state.view.dept}_${state.view.wing || 'SINGLE'}`;
      const roomLabel = [state.profile.group, state.view.wing, state.view.room].filter(Boolean).join('-');
      const activeSummaryLines = [
        `${roomLabel} (${records.length})`,
        headCnt ? `Heads: ${headCnt}` : '',
        waterM3 > 0 ? `Water: ${waterM3.toFixed(1)} m³ (${waterL.toFixed(1)} L)` : '',
        feedBags > 0 ? `Feed: ${feedBags} bags (${feedKg.toFixed(1)} kg)` : '',
        mortCnt > 0 ? `Mort: ${mortCnt} [${mortTags.join(',')}]` : ''
      ].filter(Boolean);

      const symZones = [
        { key: 'Boar House_SINGLE', title: 'Boar House', color: '#cfd8dc' },
        { key: 'GDU_SINGLE', title: 'GDU', color: '#f3e5f5' },
        { key: 'Gestation_A', title: 'Gestation A', color: '#e0f2f1' },
        { key: 'Gestation_B', title: 'Gestation B', color: '#e0f2f1' },
        { key: 'Farrowing_A', title: 'Farrowing A', color: '#ffebee' },
        { key: 'Farrowing_B', title: 'Farrowing B', color: '#ffebee' },
        { key: 'Nursery_A', title: 'Nursery A', color: '#fffde7' },
        { key: 'Nursery_B', title: 'Nursery B', color: '#fffde7' },
        { key: 'Porker_A', title: 'Porker A (1A-8B)', color: '#eceff1' },
        { key: 'Porker_B', title: 'Porker B (1A-8B)', color: '#eceff1' }
      ];

      state.lastDiarySummary = {
        fileName: `${ymd} ${roomLabel || 'Room'} diary report.png`,
        displayDt,
        workerName: state.workerName,
        activeKey,
        activeSummaryLines,
        symZones,
        isExit: state.view.dept === 'Exit'
      };

      const cellsHtml = symZones.map(z => {
        const isAct = z.key === activeKey;
        const bg = isAct ? z.color : '#f1f5f9';
        const bodyTxt = isAct ? activeSummaryLines.join('<br>') : '-';
        return `<div class="diary-cell ${isAct ? 'active-zone' : ''}" style="background:${bg};">
          <div class="diary-cell-title">${z.title}</div>
          <div>${bodyTxt}</div>
        </div>`;
      }).join('');

      const exitActive = state.view.dept === 'Exit';
      diaryPanel.innerHTML = `
        <div class="sec-title">${t.diaryHeader}</div>
        <div class="field-hint">${t.diaryRemind}</div>
        <div class="diary-report-card">
          <div class="diary-top-dt">${displayDt}</div>
          <div class="diary-sym-grid">${cellsHtml}</div>
          <div class="diary-cell ${exitActive ? 'active-zone' : ''}" style="margin-top:6px; background:${exitActive ? '#fff3e0' : '#f1f5f9'};">
            <div class="diary-cell-title">Exit / Sales / Cull / Mortality</div>
            <div>${exitActive ? activeSummaryLines.join('<br>') : '-'}</div>
          </div>
          <div class="diary-footer-sign">
            <span>${state.workerName}</span>
            <span>${displayDt}</span>
          </div>
        </div>
        <button type="button" class="primary-btn" onclick="downloadDiaryPng()">${t.downloadPngBtn}</button>
      `;
    }

    function downloadDiaryPng() {
      const info = state.lastDiarySummary;
      if (!info) return;
      const canvas = document.createElement('canvas');
      canvas.width = 720;
      canvas.height = 920;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.strokeRect(16, 16, 688, 888);

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(info.displayDt, 360, 62);

      const colW = 326, rowH = 122, gapX = 16, gapY = 12;
      info.symZones.forEach((z, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const x = 26 + col * (colW + gapX);
        const y = 88 + row * (rowH + gapY);
        const isAct = z.key === info.activeKey;

        ctx.fillStyle = isAct ? z.color : '#f1f5f9';
        ctx.fillRect(x, y, colW, rowH);
        ctx.strokeStyle = isAct ? '#0f172a' : '#cbd5e1';
        ctx.lineWidth = isAct ? 3 : 1.5;
        ctx.strokeRect(x, y, colW, rowH);

        ctx.textAlign = 'left';
        ctx.fillStyle = isAct ? '#0f172a' : '#64748b';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(z.title, x + 12, y + 28);

        if (isAct) {
          ctx.font = 'bold 15px sans-serif';
          info.activeSummaryLines.forEach((line, li) => {
            ctx.fillText(line, x + 12, y + 52 + li * 20);
          });
        }
      });

      const exY = 88 + 5 * (rowH + gapY);
      ctx.fillStyle = info.isExit ? '#fff3e0' : '#f1f5f9';
      ctx.fillRect(26, exY, 668, 86);
      ctx.strokeStyle = info.isExit ? '#0f172a' : '#cbd5e1';
      ctx.strokeRect(26, exY, 668, 86);
      ctx.textAlign = 'left';
      ctx.fillStyle = info.isExit ? '#0f172a' : '#64748b';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('Exit / Sales / Cull / Mortality', 38, exY + 28);
      if (info.isExit) {
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(info.activeSummaryLines.join(' | '), 38, exY + 56);
      }

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(info.workerName, 28, 882);
      ctx.textAlign = 'right';
      ctx.fillText(info.displayDt, 692, 882);

      const link = document.createElement('a');
      link.download = info.fileName;
      link.href = canvas.toDataURL('image/png');
      link.click();
      playTone('success');
    }

    function getQueue() {
      try { return JSON.parse(localStorage.getItem(CONFIG.KEYS.QUEUE) || '[]'); }
      catch (e) { return []; }
    }

    function refreshQueuePill() {
      const q = getQueue();
      const el = document.getElementById('queuePill');
      if (q.length > 0) {
        el.textContent = q.length;
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    async function syncOfflineQueue() {
      const q = getQueue();
      if (!q.length) return;
      const keep = [];
      for (const item of q) {
        try {
          const res = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(item)
          });
          const j = await res.json();
          if (!j || !j.ok) keep.push(item);
        } catch (e) {
          keep.push(item);
        }
      }
      localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(keep));
      refreshQueuePill();
    }

    window.addEventListener('online', syncOfflineQueue);

    (function init() {
      state.soundOn = localStorage.getItem(CONFIG.KEYS.SOUND) !== '0';
      state.workerName = localStorage.getItem(CONFIG.KEYS.WORKER) || '';
      document.getElementById('workerNameInput').value = state.workerName;

      state.lang = detectSystemLang();
      document.documentElement.lang = state.lang;
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
      applyTexts();
      updateClockAndForecastCurve();
      setInterval(updateClockAndForecastCurve, 1000);
      loadForecastWeather();
      refreshQueuePill();
      logTraj('init');

      const savedPass = localStorage.getItem(CONFIG.KEYS.PASS);
      if (savedPass) {
        const prof = parsePass(savedPass);
        if (prof) {
          state.profile = prof;
          openWorkspace();
        }
      }
    })();
  </script>
</body>
</html>
