<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef2f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GLA Mobile Hub</title>
  <style>
    /* === [START MODULE 3: PIXEL-LIKE SOFT ROUNDED LIVE TILES & NAVIGATION] === */
    :root {
      --bg-canvas: #eef2f7;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;

      /* 清淡柔和色系 */
      --tile-gp: #ede7f6;
      --tile-gp-border: #b39ddb;
      --tile-ps: #e8f5e9;
      --tile-ps-border: #81c784;

      --tile-gest: #e0f2f1;
      --tile-gest-border: #80cbc4;

      --tile-farr: #ffebee;
      --tile-farr-border: #ef9a9a;

      --tile-nurs: #fffde7;
      --tile-nurs-border: #fff176;

      --tile-pork: #eceff1;
      --tile-pork-border: #b0bec5;

      --tile-boar: #cfd8dc;
      --tile-boar-border: #90a4ae;

      --tile-gdu: #f3e5f5;
      --tile-gdu-border: #ce93d8;

      --tile-maint: #fff3e0;
      --tile-maint-border: #ffcc80;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 18px 78px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #e8eef6 0%, #f7f9fc 100%);
      color: var(--text-primary);
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 左右側邊細長條 + 半隱形三角形 */
    .edge-rail {
      position: fixed;
      top: 0;
      bottom: 58px;
      width: 14px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.04);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .edge-rail:hover, .edge-rail:active {
      background: rgba(2, 132, 199, 0.14);
    }
    .edge-rail.left { left: 0; }
    .edge-rail.right { right: 0; }

    .ghost-triangle {
      width: 0;
      height: 0;
      opacity: 0.22;
      transition: opacity 0.2s ease;
    }
    .edge-rail:hover .ghost-triangle, .edge-rail:active .ghost-triangle {
      opacity: 0.65;
    }
    .ghost-triangle.left-tri {
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 7px solid #334155;
    }
    .ghost-triangle.right-tri {
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 7px solid #334155;
    }

    /* 頂部列與語系 */
    .top-bar {
      max-width: 980px;
      margin: 12px auto 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lang-group {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    /* Google 手機風格：日期、跳動時鐘、地點、天氣與全天溫度曲線 */
    .pixel-weather-card {
      max-width: 980px;
      margin: 10px auto 14px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 20px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }

    .weather-top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .clock-big {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.05;
      color: #0f172a;
    }

    .date-loc-line {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 5px;
    }

    .weather-now-box {
      text-align: right;
    }

    .temp-now {
      font-size: 28px;
      font-weight: 800;
      color: #0369a1;
    }

    .rain-status {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-top: 3px;
    }

    .temp-curve-wrap {
      margin-top: 12px;
      background: #f8fafc;
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid #eef2f6;
    }

    .temp-curve-label {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* 登入框（零密碼暗示） */
    .auth-box {
      max-width: 440px;
      margin: 28px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    .field-label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1e293b;
    }

    .input-box {
      width: 100%;
      padding: 13px 15px;
      font-size: 17px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
    }

    .action-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      background: #0284c7;
      color: #ffffff;
      cursor: pointer;
    }

    /* 柔和圓弧動態磚網格 */
    .main-wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    .section-spacer {
      height: 22px;
    }

    .section-heading {
      font-size: 18px;
      font-weight: 800;
      margin: 6px 0 10px 2px;
      color: #1e293b;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 680px) {
      .tile-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @keyframes tileSoftFlip {
      0% { transform: perspective(700px) rotateX(0deg) scale(1); }
      45% { transform: perspective(700px) rotateX(14deg) scale(0.985); }
      100% { transform: perspective(700px) rotateX(0deg) scale(1); }
    }

    .live-tile {
      border-radius: 22px;
      padding: 18px 16px;
      min-height: 124px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid transparent;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      user-select: none;
    }

    .live-tile:active {
      transform: scale(0.96);
    }

    .live-tile.anim-flip {
      animation: tileSoftFlip 0.75s ease;
    }

    .live-tile.wide {
      grid-column: span 2;
    }

    .tile-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
      color: #0f172a;
    }

    .tile-sub {
      font-size: 15px;
      font-weight: 600;
      color: #334155;
      margin-top: 8px;
      line-height: 1.3;
    }

    .tile-tag {
      align-self: flex-end;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #1e293b;
      margin-top: 10px;
    }

    .t-gp { background: var(--tile-gp); border-color: var(--tile-gp-border); }
    .t-ps { background: var(--tile-ps); border-color: var(--tile-ps-border); }
    .t-gest { background: var(--tile-gest); border-color: var(--tile-gest-border); }
    .t-farr { background: var(--tile-farr); border-color: var(--tile-farr-border); }
    .t-nurs { background: var(--tile-nurs); border-color: var(--tile-nurs-border); }
    .t-pork { background: var(--tile-pork); border-color: var(--tile-pork-border); }
    .t-boar { background: var(--tile-boar); border-color: var(--tile-boar-border); }
    .t-gdu { background: var(--tile-gdu); border-color: var(--tile-gdu-border); }
    .t-maint { background: var(--tile-maint); border-color: var(--tile-maint-border); }

    .panel-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      margin-top: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }

    .chip-btn.selected {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .field-block {
      margin-bottom: 14px;
    }

    .notice-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f1f5f9;
      font-size: 15px;
      font-weight: 600;
      white-space: pre-wrap;
    }

    /* 底部模擬手機上一頁／下一頁導航列 */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding: 0 12px;
      gap: 10px;
    }

    .nav-step-btn {
      flex: 1;
      height: 42px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
    /* === [END MODULE 3] === */
  </style>
</head>
<body>
  <!-- 左右側邊細長條 + 半隱形三角形 -->
  <div class="edge-rail left" onclick="goPrevStep()" title="Prev">
    <div class="ghost-triangle left-tri"></div>
  </div>
  <div class="edge-rail right" onclick="goNextStep()" title="Next">
    <div class="ghost-triangle right-tri"></div>
  </div>

  <!-- 頂部語系與層級切換 -->
  <div class="top-bar">
    <div class="lang-group">
      <button class="pill-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">繁中</button>
      <button class="pill-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="pill-btn" data-lang="ms" onclick="setLang('ms')">BM</button>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <span id="tierPill" class="pill-btn" style="cursor:default;">-</span>
      <span id="queuePill" class="pill-btn hidden" style="background:#f59e0b; color:#fff; border-color:#f59e0b;" onclick="syncOfflineQueue()">0</span>
      <button class="pill-btn" id="btnSwitchPass" onclick="promptNewPassword()"></button>
      <button class="pill-btn" id="btnClearMem" onclick="clearSavedMemory()"></button>
    </div>
  </div>

  <!-- Google 手機風格：時鐘、日期、地點、天氣與全天溫度變化曲線 -->
  <section class="pixel-weather-card">
    <div class="weather-top-row">
      <div>
        <div class="clock-big" id="liveClock">--:--:--</div>
        <div class="date-loc-line" id="dateAndLoc">--</div>
      </div>
      <div class="weather-now-box">
        <div class="temp-now" id="tempNow">--°C</div>
        <div class="rain-status" id="rainForecast">--</div>
      </div>
    </div>
    <div class="temp-curve-wrap">
      <div class="temp-curve-label">
        <span id="curveTitle"></span>
        <span id="curveRange"></span>
      </div>
      <svg id="tempCurveSvg" viewBox="0 0 360 76" width="100%" height="76" aria-label="Temperature Curve"></svg>
    </div>
  </section>

  <!-- 密碼輸入框（不放任何密碼暗示） -->
  <section id="loginSection" class="auth-box">
    <label class="field-label" id="loginPromptLabel" for="loginPassInput"></label>
    <input type="password" id="loginPassInput" class="input-box" autocomplete="off" />
    <button type="button" class="action-btn" id="btnEnterPass" onclick="handleLoginSubmit()"></button>
    <div id="loginError" class="notice-box hidden" style="background:#fee2e2; color:#991b1b;"></div>
  </section>

  <!-- 主畫面 -->
  <main id="appMain" class="main-wrap hidden">
    <div id="pathBar" class="section-heading"></div>

    <!-- 上方：部門或場域動態磚 -->
    <div id="topTilesGrid" class="tile-grid"></div>

    <!-- 間隔 -->
    <div id="midSpacer" class="section-spacer"></div>

    <!-- 下方：進階/分析/查詢方塊（依密碼層級顯示，例如 gla9999 / 510067 / gp3333 / qwert） -->
    <div id="bottomSubHeading" class="section-heading hidden"></div>
    <div id="bottomTilesGrid" class="tile-grid"></div>

    <!-- 表單與查詢/報表/管理面板 -->
    <div id="workPanel" class="panel-card hidden"></div>
    <div id="extraPanel" class="panel-card hidden"></div>
  </main>

  <!-- 底部模擬手機上一頁／下一頁導航列 -->
  <nav class="bottom-nav">
    <button type="button" class="nav-step-btn" id="btnBottomPrev" onclick="goPrevStep()">◀</button>
    <button type="button" class="nav-step-btn" id="btnBottomNext" onclick="goNextStep()">▶</button>
  </nav>

  <script>
    // === [START MODULE 4: CLOCK, WEATHER CURVE, COMPRESSION, OFFLINE & ROUTING] ===
    const CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycbyEod8PcLLZYsglmyef9s3AHkzD4gpitKXQDew1YS6fqhlofZp43_iA9uw1SwQzzXiqRg/exec',
      API_TOKEN: 'GLA_FIELD_INTAKE_TOKEN_2026',
      PASSWORDS: {
        ps_basic: 'gla8888',
        ps_query: 'gla9999',
        ps_report: '510067',
        gp_basic: 'gp2222',
        gp_query: 'gp3333',
        admin: 'qwert'
      },
      KEYS: {
        LANG: 'gla_m_lang',
        PASS: 'gla_m_pass',
        QUEUE: 'gla_m_queue'
      },
      LAT: 1.167,
      LON: 110.566,
      MAX_IMG_PX: 800,
      IMG_QUALITY: 0.65
    };

    const TEXT = {
      'zh-TW': {
        passPrompt: '輸入密碼',
        enterBtn: '確認',
        switchPass: '切換密碼',
        clearMem: '清除記憶',
        wrongPass: '密碼無效',
        prevPage: '上一頁',
        nextPage: '下一頁',
        locLabel: '古晉 / 西連一帶 (Serian · Kuching)',
        curveTitle: '今日逐時溫度變化曲線',
        rainYes: '今日有降雨機率',
        rainNo: '今日降雨機率偏低',
        deptsHeading: '部門與作業區',
        extraHeading: '分析與查詢專區',
        submitBtn: '送出資料',
        savedOk: '已寫入，編號：',
        savedQueue: '已暫存本機待補傳'
      },
      'en': {
        passPrompt: 'Access Code',
        enterBtn: 'Enter',
        switchPass: 'Code',
        clearMem: 'Clear',
        wrongPass: 'Invalid code',
        prevPage: 'Prev',
        nextPage: 'Next',
        locLabel: 'Serian · Kuching, Sarawak',
        curveTitle: 'Today Hourly Temperature Curve',
        rainRainy: 'Rain expected today',
        rainDry: 'Low rain chance today',
        deptsHeading: 'Departments',
        extraHeading: 'Analytics & Lookup',
        submitBtn: 'Submit',
        savedOk: 'Saved. ID: ',
        savedQueue: 'Saved offline'
      },
      'ms': {
        passPrompt: 'Kod Akses',
        enterBtn: 'Masuk',
        switchPass: 'Kod',
        clearMem: 'Padam',
        wrongPass: 'Kod tidak sah',
        prevPage: 'Kembali',
        nextPage: 'Seterusnya',
        locLabel: 'Serian · Kuching, Sarawak',
        curveTitle: 'Keluk Suhu Mengikut Jam Hari Ini',
        rainYes: 'Kebimbangan hujan hari ini',
        rainNo: 'Peluang hujan rendah hari ini',
        deptsHeading: 'Jabatan',
        extraHeading: 'Analisis & Carian',
        submitBtn: 'Hantar',
        savedOk: 'Tersimpan. ID: ',
        savedQueue: 'Disimpan luar talian'
      }
    };

    const state = {
      lang: 'zh-TW',
      savedPass: '',
      profile: null, // { group: 'PS'|'GP', level: 'basic'|'query'|'report'|'admin' }
      enteredAt: new Date().toISOString(),
      enteredMs: Date.now(),
      trajectory: [],
      history: [],
      redoStack: [],
      view: {
        stage: 'depts', // 'depts' | 'wing' | 'room' | 'form'
        dept: '',
        wing: '',
        room: '',
        module: ''
      },
      chips: {},
      hourlyTemps: [25, 25, 24, 24, 25, 27, 29, 31, 32, 32, 31, 28, 26]
    };

    function detectLang() {
      const saved = localStorage.getItem(CONFIG.KEYS.LANG);
      if (saved && TEXT[saved]) return saved;
      const list = (navigator.languages || [navigator.language || 'zh-TW']).join(',').toLowerCase();
      if (list.includes('ms') || list.includes('my')) return 'ms';
      if (list.includes('en')) return 'en';
      return 'zh-TW';
    }

    function setLang(l) {
      if (!TEXT[l]) return;
      state.lang = l;
      localStorage.setItem(CONFIG.KEYS.LANG, l);
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
      logTraj('lang:' + l);
      applyI18n();
      renderWeatherAndClock();
      if (state.profile) renderAllViews();
    }

    function applyI18n() {
      const t = TEXT[state.lang];
      document.getElementById('loginPromptLabel').textContent = t.passPrompt;
      document.getElementById('btnEnterPass').textContent = t.enterBtn;
      document.getElementById('btnSwitchPass').textContent = t.switchPass;
      document.getElementById('btnClearMem').textContent = t.clearMem;
      document.getElementById('btnBottomPrev').textContent = '◀ ' + t.prevPage;
      document.getElementById('btnBottomNext').textContent = t.nextPage + ' ▶';
      document.getElementById('curveTitle').textContent = t.curveTitle;
      document.getElementById('deptsHeading')?.setAttribute('data-i', '1');
      const dh = document.querySelector('#topTilesGrid').previousElementSibling;
      if (dh && dh.classList.contains('section-heading')) dh.textContent = t.deptsHeading;
      document.getElementById('bottomSubHeading').textContent = t.extraHeading;
    }

    function logTraj(tag) {
      const s = Math.round((Date.now() - state.enteredMs) / 1000);
      state.trajectory.push(s + 's:' + tag);
      if (state.trajectory.length > 50) state.trajectory.shift();
    }

    function parsePassword(raw) {
      const p = String(raw || '').trim().toLowerCase();
      if (p === CONFIG.PASSWORDS.ps_basic) return { group: 'PS', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.ps_query) return { group: 'PS', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.ps_report) return { group: 'PS', level: 'report', code: p };
      if (p === CONFIG.PASSWORDS.gp_basic) return { group: 'GP', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.gp_query) return { group: 'GP', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.admin) return { group: 'PS', level: 'admin', code: p };
      return null;
    }

    function handleLoginSubmit() {
      const val = document.getElementById('loginPassInput').value;
      const prof = parsePassword(val);
      const errEl = document.getElementById('loginError');
      if (!prof) {
        errEl.textContent = TEXT[state.lang].wrongPass;
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');
      state.profile = prof;
      state.savedPass = prof.code;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      logTraj('login:' + prof.group + ':' + prof.level);
      enterWorkspace();
    }

    function promptNewPassword() {
      const p = prompt(TEXT[state.lang].passPrompt);
      if (p === null) return;
      const prof = parsePassword(p);
      if (!prof) {
        alert(TEXT[state.lang].wrongPass);
        return;
      }
      state.profile = prof;
      state.savedPass = prof.code;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      state.view = { stage: 'depts', dept: '', wing: '', room: '', module: '' };
      state.history = [];
      state.redoStack = [];
      logTraj('switch:' + prof.group + ':' + prof.level);
      enterWorkspace();
    }

    function clearSavedMemory() {
      localStorage.removeItem(CONFIG.KEYS.PASS);
      state.profile = null;
      state.savedPass = '';
      document.getElementById('appMain').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginPassInput').value = '';
      document.getElementById('tierPill').textContent = '-';
    }

    function enterWorkspace() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appMain').classList.remove('hidden');
      document.getElementById('tierPill').textContent = state.profile.group + ' · ' + state.profile.level;
      renderAllViews();
    }

    // 時鐘、日期、地點與溫度曲線
    function renderWeatherAndClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('liveClock').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

      const y = now.getFullYear();
      const m = pad(now.getMonth() + 1);
      const d = pad(now.getDate());
      const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];
      document.getElementById('dateAndLoc').textContent = `${y}-${m}-${d} (${wk})  ·  ${TEXT[state.lang].locLabel}`;

      const idx = Math.min(state.hourlyTemps.length - 1, Math.floor(now.getHours() / 2));
      const curT = state.hourlyTemps[idx];
      document.getElementById('tempNow').textContent = curT + '°C';
      drawTemperatureCurve(state.hourlyTemps);
    }

    function drawTemperatureCurve(arr) {
      const svg = document.getElementById('tempCurveSvg');
      const minV = Math.min(...arr) - 1;
      const maxV = Math.max(...arr) + 1;
      document.getElementById('curveRange').textContent = `Min ${Math.min(...arr)}°C · Max ${Math.max(...arr)}°C`;

      const pts = arr.map((v, i) => {
        const x = 16 + (i / Math.max(1, arr.length - 1)) * 328;
        const y = 62 - ((v - minV) / Math.max(1, maxV - minV)) * 46;
        return [x, y];
      });

      const lineD = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      const areaD = lineD + ` L${pts[pts.length-1][0].toFixed(1)},68 L${pts[0][0].toFixed(1)},68 Z`;

      svg.innerHTML = `
        <defs>
          <linearGradient id="tempGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="${areaD}" fill="url(#tempGrad)"></path>
        <path d="${lineD}" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#0369a1"></circle>`).join('')}
      `;
    }

    async function fetchLiveWeather() {
      const t = TEXT[state.lang];
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FKuching&forecast_days=1`;
        const r = await fetch(url);
        const j = await r.json();
        if (j && j.hourly && Array.isArray(j.hourly.temperature_2m)) {
          const picked = [];
          for (let h = 0; h < 24; h += 2) {
            if (j.hourly.temperature_2m[h] !== undefined) picked.push(Math.round(j.hourly.temperature_2m[h]));
          }
          if (picked.length > 0) state.hourlyTemps = picked;
          const probs = j.hourly.precipitation_probability || [];
          const maxProb = probs.length ? Math.max(...probs) : 0;
          document.getElementById('rainForecast').textContent =
            (maxProb >= 50 ? t.rainYes : t.rainNo) + ` (${maxProb}%)`;
          renderWeatherAndClock();
          return;
        }
      } catch (e) {}
      document.getElementById('rainForecast').textContent = t.rainYes;
    }

    // 歷史前進／後退（支援側邊條與底部按鈕）
    function snapshotView() {
      return JSON.parse(JSON.stringify(state.view));
    }

    function pushHistory() {
      state.history.push(snapshotView());
      state.redoStack = [];
    }

    function goPrevStep() {
      if (state.history.length === 0) return;
      state.redoStack.push(snapshotView());
      state.view = state.history.pop();
      logTraj('back');
      renderAllViews();
    }

    function goNextStep() {
      if (state.redoStack.length === 0) return;
      state.history.push(snapshotView());
      state.view = state.redoStack.pop();
      logTraj('forward');
      renderAllViews();
    }

      items.forEach(it => {

        h += `<button type="button" class="chip-btn" data-g="${id}" data-v="${v}" data-m="${multi ? '1' : '0'}" onclick="pickChip(this)">${l}</button>`;
      });
      h += `</div>`;

    function pickChip(btn) {
      const g = btn.dataset.g;
      const v = btn.dataset.v;
      const m = btn.dataset.m === '1';
      if (m) {
        btn.classList.toggle('selected');
        const arr = state.chips[g] || [];
        const i = arr.indexOf(v);
        if (i >= 0) arr.splice(i, 1);
        else arr.push(v);
        state.chips[g] = arr;
      } else {
        document.querySelectorAll(`.chip-btn[data-g="${g}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.chips[g] = v;

    function compressPhoto(file) {
      return new Promise((res, rej) => {
        if (!file) return res(null);
        const fr = new FileReader();
        fr.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const maxP = CONFIG.MAX_IMG_PX;
            if (w > maxP || h > maxP) {
              if (w >= h) { h = Math.round(h * maxP / w); w = maxP; }
              else { w = Math.round(w * maxP / h); h = maxP; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            res({ mimeType: 'image/jpeg', base64: c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY) });
          };
          img.onerror = rej;
          img.src = e.target.result;
        };
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
    }

    async function submitEntry() {
      const btn = document.getElementById('btnSubmitData');
      const box = document.getElementById('submitResultBox');
      btn.disabled = true;
      box.classList.remove('hidden');
      box.textContent = '...';

      const data = {};
      document.querySelectorAll('#workPanel [id^="f_"]').forEach(el => {
        if (el.type === 'file') return;
        data[el.id.replace(/^f_/, '')] = el.value;
      });
      Object.keys(state.chips).forEach(k => { data[k] = state.chips[k]; });

      let photo = null;
      const fInput = document.getElementById('f_photo_file');
      if (fInput && fInput.files && fInput.files[0]) {
        photo = await compressPhoto(fInput.files[0]);
      }

      const modMap = {
        'GDU': 'conformation',
        'Gestation': 'gestation',
        'Farrowing': data.affected_count ? 'malformation_disease' : 'farrowing',
        'Boar House': 'boar_semen',
        'Nursery': 'daily_fw',
        'Porker': 'daily_fw'
      };
      const mod = modMap[state.view.dept] || 'daily_fw';
      logTraj('submit:' + mod);

      const payload = {
        token: CONFIG.API_TOKEN,
        module: mod,
        common: {
          farm_mode: state.profile.group,
          wing: state.view.wing,
          location: [state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' / '),
          module: mod
        },
        data: data,
        photo: photo,
        meta: {
          entered_at: state.enteredAt,
          submitted_at: new Date().toISOString(),
          dwell_seconds: Math.max(1, Math.round((Date.now() - state.enteredMs) / 1000)),
          ui_lang: state.lang,
          role_level: state.profile.level,
          device_summary: /mobile|android|iphone|ipad/i.test(navigator.userAgent) ? 'Mobile/Tablet' : 'Desktop',
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height + '@' + (window.devicePixelRatio || 1),
          trajectory_summary: state.trajectory.join(' -> '),
          offline_queued: false
        }
      };

      const t = TEXT[state.lang];
      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const j = await res.json();
        if (j && j.ok) {
          box.textContent = t.savedOk + (j.rowId || 'OK');
        } else {
          throw new Error(j && j.error ? j.error : 'ERR');
        }
      } catch (e) {
        payload.meta.offline_queued = true;
        const q = loadQueue();
        q.push(payload);
        localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(q));
        refreshQueueBadge();
        box.textContent = t.savedQueue;
      }
      btn.disabled = false;
    }

    function loadQueue() {
      try { return JSON.parse(localStorage.getItem(CONFIG.KEYS.QUEUE) || '[]'); }
      catch (e) { return []; }
    }

    function refreshQueueBadge() {
      const q = loadQueue();
      const pill = document.getElementById('queuePill');
      if (q.length > 0) {
        pill.textContent = q.length;
        pill.classList.remove('hidden');
      } else {
        pill.classList.add('hidden');
      }
    }

    async function syncOfflineQueue() {
      const q = loadQueue();
      if (!q.length) return;
      const keep = [];
      for (const item of q) {
        try {
          const res = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(item)
          });
          const j = await res.json();
          if (!j || !j.ok) keep.push(item);
        } catch (e) {
          keep.push(item);
        }
      }
      localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(keep));
      refreshQueueBadge();
    }

    window.addEventListener('online', syncOfflineQueue);

    (function boot() {
      state.lang = detectLang();
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
      applyI18n();
      renderWeatherAndClock();
      setInterval(renderWeatherAndClock, 1000);
      fetchLiveWeather();
      refreshQueueBadge();
      logTraj('boot');

      const saved = localStorage.getItem(CONFIG.KEYS.PASS);
      if (saved) {
        const prof = parsePassword(saved);
        if (prof) {
          state.profile = prof;
          state.savedPass = prof.code;
          enterWorkspace();
        }
      }
    })();
    // === [END MODULE 4] ===
  </script>
</body>
</html>
