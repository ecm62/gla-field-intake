<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f3f5f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GLA Field Hub</title>
  <style>
    :root {
      --bg-light: #f3f5f8;
      --fg-dark: #1f2937;
      --fg-muted: #4b5563;

      --c-boar: #d1d5db;
      --c-boar-b: #9ca3af;
      --c-gdu: #ede9fe;
      --c-gdu-b: #c4b5fd;
      --c-gest: #fee2e2;
      --c-gest-b: #fca5a5;
      --c-farr: #dcfce7;
      --c-farr-b: #86efac;
      --c-nurs: #fef9c3;
      --c-nurs-b: #fde047;
      --c-pork: #e5e7eb;
      --c-pork-b: #cbd5e1;
      --c-exit: #ffedd5;
      --c-exit-b: #fdba74;
      --c-query: #dbeafe;
      --c-query-b: #93c5fd;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      padding: 8px 24px 68px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg-light);
      color: var(--fg-dark);
      font-size: 14px;
      font-weight: 400;
      min-height: 100vh;
    }

    /* 左右側邊細長條 + 放大約 2.5 倍三角形 */
    .edge-rail {
      position: fixed;
      top: 0;
      bottom: 52px;
      width: 22px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(31, 41, 55, 0.03);
      cursor: pointer;
    }
    .edge-rail:active { background: rgba(59, 130, 246, 0.16); }
    .edge-rail.left { left: 0; }
    .edge-rail.right { right: 0; }

    .tri-big {
      width: 0;
      height: 0;
      opacity: 0.36;
    }
    .edge-rail:active .tri-big { opacity: 0.85; }
    .tri-left {
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-right: 15px solid #374151;
    }
    .tri-right {
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 15px solid #374151;
    }

    /* 頂部列 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      margin: 0 auto 8px auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .pill-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .soft-pill {
      border: 1px solid #d1d5db;
      background: rgba(255, 255, 255, 0.9);
      color: #1f2937;
      border-radius: 11px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .soft-pill.active {
      background: #dbeafe;
      border-color: #60a5fa;
      color: #1e3a8a;
    }

    .home-house-btn {
      border: 1px solid #93c5fd;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 11px;
      padding: 4px 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .exit-screen-btn {
      border: 1px solid #fca5a5;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 11px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 分離式時間、地點、現有溫度與雨情、預報曲線小框 */
    .split-widget-wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto 10px auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mini-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .box-time {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      border-radius: 13px;
      padding: 8px 11px;
    }

    .box-loc {
      background: #ede9fe;
      border: 1px solid #ddd6fe;
      border-radius: 13px;
      padding: 8px 11px;
    }

    .box-temp {
      background: #fef9c3;
      border: 1px solid #fef08a;
      border-radius: 13px;
      padding: 8px 11px;
    }

    .box-curve {
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      border-radius: 13px;
      padding: 7px 10px;
    }

    .clock-val {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      line-height: 1.15;
    }

    .date-sub {
      font-size: 12px;
      font-weight: 500;
      color: #4b5563;
      margin-top: 2px;
    }

    .loc-val {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      line-height: 1.25;
    }

    .temp-val {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }

    .rain-txt {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-top: 2px;
    }

    .curve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 2px;
    }

    .span-btn {
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.85);
      color: #1f2937;
      border-radius: 7px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 登入與離開卡片 */
    .auth-card, .exit-card {
      width: 100%;
      max-width: 420px;
      margin: 16px auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 18px;
      border: 1px solid #d1d5db;
    }

    .exit-card { text-align: center; }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #1f2937;
    }

    .field-hint {
      font-size: 12px;
      font-weight: 400;
      color: #4b5563;
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .input-box {
      width: 100%;
      padding: 9px 11px;
      font-size: 14px;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1f2937;
    }

    .primary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #60a5fa;
      border-radius: 12px;
      background: #dbeafe;
      color: #1e3a8a;
      cursor: pointer;
    }

    .secondary-btn {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
      color: #1f2937;
      cursor: pointer;
    }

    .main-wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .gp-quick-strip, .room-quick-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 5px;
    }

    .context-bar {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d1d5db;
      border-radius: 13px;
      padding: 8px 11px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .batch-chip {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: #1f2937;
      padding: 3px 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .batch-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .batch-box {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      padding: 6px 4px;
      text-align: center;
    }

    .batch-box label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 4px;
    }

    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .step-btn {
      width: 24px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f9fafb;
      color: #1f2937;
      font-size: 14px;
      font-weight: 600;
      padding: 0;
      cursor: pointer;
    }

    .batch-inp {
      width: 42px;
      height: 30px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2937;
      padding: 0;
    }

    /* 細緻圓弧 + 純上下垂直翻轉動態磚 */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .metro-flip-scene {
      perspective: 1000px;
      height: 92px;
      width: 100%;
      cursor: pointer;
    }

    .metro-flip-scene:active .metro-flip-card {
      transform: scale(0.97);
    }

    .metro-flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .metro-flip-scene.is-flipped .metro-flip-card {
      transform: rotateX(180deg);
    }

    .metro-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(31, 41, 55, 0.14);
      overflow: hidden;
    }

    .metro-back {
      transform: rotateX(180deg);
      filter: brightness(0.97);
    }

    .tile-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      color: #1f2937;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-sub {
      font-size: 12px;
      font-weight: 400;
      color: #374151;
      margin-top: 4px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tile-badge {
      align-self: flex-end;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: #374151;
    }

    .m-boar { background: var(--c-boar); border-color: var(--c-boar-b); }
    .m-gdu { background: var(--c-gdu); border-color: var(--c-gdu-b); }
    .m-gest { background: var(--c-gest); border-color: var(--c-gest-b); }
    .m-farr { background: var(--c-farr); border-color: var(--c-farr-b); }
    .m-nurs { background: var(--c-nurs); border-color: var(--c-nurs-b); }
    .m-pork { background: var(--c-pork); border-color: var(--c-pork-b); }
    .m-exit { background: var(--c-exit); border-color: var(--c-exit-b); }
    .m-query { background: var(--c-query); border-color: var(--c-query-b); }

    .section-gap { height: 18px; }
    .sec-title {
      font-size: 15px;
      font-weight: 600;
      margin: 4px 0 6px 2px;
      color: #1f2937;
    }

    .panel-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #d1d5db;
    }

    .field-block { margin-bottom: 10px; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1f2937;
      cursor: pointer;
    }

    .chip-btn.selected {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1e3a8a;
      font-weight: 600;
    }

    /* 正規查詢表格樣式 */
    .lookup-table-wrap {
      margin-top: 10px;
      overflow-x: auto;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    .lookup-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      color: #1f2937;
    }

    .lookup-table thead th {
      background: #fef9c3;
      font-weight: 600;
      color: #111827;
      padding: 7px 9px;
      border-bottom: 1px solid #cbd5e1;
      border-right: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }

    .lookup-table tbody td {
      padding: 7px 9px;
      border-bottom: 1px solid #e5e7eb;
      border-right: 1px solid #f1f5f9;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
    }

    .cart-list-box {
      margin-top: 10px;
      padding: 9px;
      border-radius: 11px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px dashed #d1d5db;
      font-size: 13px;
      font-weight: 500;
    }
    .cart-item:last-child { border-bottom: none; }
    .del-mini-btn {
      border: 1px solid #fca5a5;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .diary-report-card {
      margin-top: 12px;
      background: #ffffff;
      color: #1f2937;
      border: 1.5px solid #4b5563;
      border-radius: 13px;
      padding: 11px;
    }
    .diary-top-dt {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: #111827;
      border-bottom: 1.5px solid #4b5563;
      padding-bottom: 5px;
      margin-bottom: 7px;
    }
    .diary-sym-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .diary-cell {
      border-radius: 9px;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 11px;
      line-height: 1.3;
    }
    .diary-cell.active-zone {
      border: 1.5px solid #1f2937;
      color: #111827;
      font-weight: 600;
    }
    .diary-cell-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .diary-footer-sign {
      margin-top: 7px;
      padding-top: 5px;
      border-top: 1.5px solid #4b5563;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
    }

    .stage-tracker {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 11px;
      background: #f9fafb;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }
    .stage-tracker.st-prep { background: #eff6ff; border-color: #93c5fd; color: #1e3a8a; }
    .stage-tracker.st-sending { background: #fefce8; border-color: #fde047; color: #854d0e; }
    .stage-tracker.st-done { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .stage-tracker.st-queued { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
    .stage-tracker.st-err { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }

    .notice-box {
      margin-top: 8px;
      padding: 9px 11px;
      border-radius: 11px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      color: #1f2937;
      font-size: 13px;
      font-weight: 400;
      white-space: pre-wrap;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding: 0 18px;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      height: 36px;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1f2937;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="edge-rail left" onclick="goPrev()">
    <div class="tri-big tri-left"></div>
  </div>
  <div class="edge-rail right" onclick="goNext()">
    <div class="tri-big tri-right"></div>
  </div>

  <!-- 頂部：小房子回首頁 + 語系 BM/EN/中 + 音效開關 + 重新載入 + 離開 -->
  <div class="top-bar">
    <div class="pill-group">
      <button type="button" class="home-house-btn" id="btnHomeHouse" onclick="goHomeHouse()" title="Home">🏠</button>
      <button type="button" class="soft-pill" data-lang="ms" onclick="setLang('ms')">BM</button>
      <button type="button" class="soft-pill" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="soft-pill" data-lang="zh-TW" onclick="setLang('zh-TW')">中</button>
    </div>
    <div class="pill-group">
      <button type="button" class="soft-pill active" id="btnSoundToggle" onclick="toggleSound()"></button>
      <button type="button" class="soft-pill" id="btnReload" onclick="reloadApp()"></button>
      <button type="button" class="exit-screen-btn" id="btnExitScreen" onclick="openExitScreen()"></button>
      <span id="queuePill" class="soft-pill hidden" style="background:#fef3c7; border-color:#f59e0b;" onclick="syncOfflineQueue()">0</span>
    </div>
  </div>

  <!-- 分離式時間、地點、現有溫度與雨情、預報曲線小框 -->
  <section class="split-widget-wrap">
    <div class="mini-row-2">
      <div class="box-time">
        <div class="clock-val" id="clockNow">--:--:--</div>
        <div class="date-sub" id="dateSub">--</div>
      </div>
      <div class="box-loc">
        <div class="loc-val" id="locSub">--</div>
        <div class="date-sub" id="groupStatusSub">-</div>
      </div>
    </div>

    <div class="mini-row-2">
      <div class="box-temp">
        <div class="temp-val" id="tempNowVal">--°C</div>
        <div class="rain-txt" id="rainNowTxt">--</div>
      </div>
      <div class="box-curve">
        <div class="curve-header">
          <span id="curveTitle"></span>
          <button type="button" class="span-btn" id="btnSpanToggle" onclick="toggleSpan()">±3H/±6H</button>
        </div>
        <svg id="forecastCurveSvg" viewBox="0 0 240 52" width="100%" height="52"></svg>
      </div>
    </div>
  </section>

  <!-- 登入前畫面：姓名 + 密碼 -->
  <section id="loginCard" class="auth-card">
    <div class="field-block">
      <label class="field-label" id="lblWorkerName" for="loginWorkerInput"></label>
      <input type="text" id="loginWorkerInput" class="input-box" autocomplete="off" />
    </div>
    <div class="field-block">
      <label class="field-label" id="lblPass" for="inpPass"></label>
      <input type="password" id="inpPass" class="input-box" autocomplete="off" onkeydown="if(event.key==='Enter') submitLogin();" />
    </div>
    <button type="button" class="primary-btn" id="btnLogin" onclick="submitLogin()"></button>
    <div id="errLogin" class="notice-box hidden" style="background:#fef2f2; border-color:#fca5a5; color:#991b1b;"></div>
  </section>

  <!-- 離開畫面 -->
  <section id="exitCard" class="exit-card hidden">
    <div style="font-size:17px; font-weight:600; margin-bottom:6px;" id="exitTitle"></div>
    <div style="font-size:13px; color:#4b5563; margin-bottom:12px;" id="exitDesc"></div>
    <button type="button" class="primary-btn" id="btnReenterFromExit" onclick="reenterFromExit()"></button>
    <button type="button" class="secondary-btn" id="btnReenterWithPass" onclick="reenterWithNewPass()"></button>
  </section>

  <!-- 主工作區 -->
  <main id="workspaceMain" class="main-wrap hidden">
    <div id="gpQuickStrip" class="gp-quick-strip hidden"></div>
    <div id="roomQuickStrip" class="room-quick-strip hidden"></div>

    <div class="context-bar">
      <span id="locBannerText">-</span>
      <span id="batchBannerBtn" class="batch-chip hidden" onclick="reopenBatchGate()"></span>
    </div>

    function translateQueryText(rawText) {
      let s = String(rawText || '');
      if (!s) return '';
      if (s.indexOf('GMT') !== -1 || s.indexOf('新加坡') !== -1) {
        const d = new Date(s);
        if (!isNaN(d.getTime())) {
          const pad = n => String(n).padStart(2, '0');
          s = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }
      }
      if (state.lang === 'zh-TW') return s;
      CN_TO_OTHER.forEach(rule => {
        s = s.split(rule.cn).join(state.lang === 'en' ? rule.en : rule.ms);
      });
      return s;
    }

    function unlockAudioContext() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!state.audioCtx) state.audioCtx = new AudioCtx();
        if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
      } catch (e) {}
    }

    // 方塊敲擊／微變鈴聲 + 傳送音效
    function playTone(type) {
      if (!state.soundOn) return;
      unlockAudioContext();
      try {
        const ctx = state.audioCtx;
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'tap') {
          // 每次點方塊微變清脆敲擊鈴聲
          const notes = [523.25, 554.37, 587.33, 622.25, 659.25];
          const f = notes[state.tapStep % notes.length];
          state.tapStep++;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 1.04, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'send') {
          // 傳送完成雙音鈴聲
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880.0, now + 0.11);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'step') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(660.0, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.start(now);
          osc.stop(now + 0.14);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220.0, now);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        }
      } catch (e) {}
    }

    function detectSystemLang() {
      const saved = localStorage.getItem(CONFIG.KEYS.LANG);
      if (saved && DICT[saved]) return saved;
      const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'ms'];
      for (const item of list) {
        const low = String(item).toLowerCase();
        if (low.startsWith('ms') || low.includes('may') || low.includes('my')) return 'ms';
        if (low.startsWith('en')) return 'en';
        if (low.startsWith('zh')) return 'zh-TW';
      }
      return 'ms';
    }

      const sec = Math.round((Date.now() - state.enteredMs) / 1000);

      if (state.trajectory.length > 60) state.trajectory.shift();

    function sendTelemetryBeacon(eventName, targetArea) {
      if (!state.profile) return;
      const dwell = Math.max(1, Math.round((Date.now() - state.stageStartMs) / 1000));
      state.stageStartMs = Date.now();
      const body = JSON.stringify({
        token: CONFIG.API_TOKEN,
        action: 'telemetry',
        meta: {
          worker_name: state.workerName || 'Unnamed',
          role_level: state.profile.level,
          event_name: eventName,
          target_area: targetArea,
          dwell_seconds: dwell,
          trajectory_summary: state.trajectory.slice(-10).join(' -> '),
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height
        }
      });
      fetch(CONFIG.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body
      }).catch(() => {});
    }

    function parsePass(raw) {
      const p = String(raw || '').trim().toLowerCase();
      if (p === CONFIG.PASSWORDS.ps_basic) return { group: 'PS', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.ps_query) return { group: 'PS', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.ps_report) return { group: 'PS', level: 'report', code: p };
      if (p === CONFIG.PASSWORDS.gp_basic) return { group: 'GP', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.gp_query) return { group: 'GP', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.admin) return { group: 'PS', level: 'admin', code: p };
      return null;
    }

        err.textContent = t.errNoName;
        err.classList.remove('hidden');
        playTone('error');

      const prof = parsePass(document.getElementById('inpPass').value);
      if (!prof) {

        err.classList.remove('hidden');
        playTone('error');
        return;

      err.classList.add('hidden');
      state.workerName = wName;
      localStorage.setItem(CONFIG.KEYS.WORKER, wName);
      state.profile = prof;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      logTraj('login:' + prof.group);
      playTone('send');
      sendTelemetryBeacon('LOGIN', prof.group);
      openWorkspace();

      if (dept === 'Farrowing') return ['F1', 'F2', 'F3', 'F4', 'F5', 'F6'];

      if (dept === 'Porker') {
        const w = wing || 'A';
        const arr = [];

    // 統一以本地／古晉時間顯示（絕不出現新加坡時間）
    function updateClockAndForecastCurve() {
      const t = DICT[state.lang];
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const curH = now.getHours();
      const curM = now.getMinutes();

      document.getElementById('clockNow').textContent = `${pad(curH)}:${pad(curM)}:${pad(now.getSeconds())}`;
      document.getElementById('dateSub').textContent = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      document.getElementById('locSub').textContent = state.profile
        ? `${t.locationName} (${state.profile.group})`
        : t.locationName;

      const curTemp = state.hourly24[curH] !== undefined ? state.hourly24[curH] : 29;
      document.getElementById('tempNowVal').textContent = curTemp + '°C';
      document.getElementById('rainNowTxt').textContent =
        (state.rainProbMax >= 50 ? t.rainLikely : t.rainLow) + ` (${state.rainProbMax}%)`;

      const k = state.halfSpan;
      const points = [];
      for (let offset = -k; offset <= k; offset++) {
        const hIdx = Math.max(0, Math.min(23, curH + offset));
        points.push({ offset, hour: hIdx, temp: state.hourly24[hIdx] ?? curTemp });
      }

      const temps = points.map(p => p.temp);
      const minT = Math.min(...temps) - 1;
      const maxT = Math.max(...temps) + 1;

      const coords = points.map((pt, idx) => {
        const x = 14 + (idx / Math.max(1, points.length - 1)) * 212;
        const y = 38 - ((pt.temp - minT) / Math.max(1, maxT - minT)) * 24;
        return { x, y, hour: pt.hour, temp: pt.temp };
      });

      const centerPt = coords[Math.floor(coords.length / 2)];
      const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
      const areaPath = linePath + ` L${coords[coords.length - 1].x.toFixed(1)},43 L${coords[0].x.toFixed(1)},43 Z`;

      const svg = document.getElementById('forecastCurveSvg');
      svg.innerHTML = `
        <defs>
          <linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#16a34a" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#16a34a" stop-opacity="0.03"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#fcGrad)"></path>
        <path d="${linePath}" fill="none" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"></path>
        ${coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.2" fill="#166534"></circle>`).join('')}
        <line x1="${centerPt.x.toFixed(1)}" y1="4" x2="${centerPt.x.toFixed(1)}" y2="45" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="2.5,2"></line>
        <circle cx="${centerPt.x.toFixed(1)}" cy="${centerPt.y.toFixed(1)}" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"></circle>
        <text x="${centerPt.x.toFixed(1)}" y="10" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">${t.nowLabel} ${curTemp}°</text>
        <text x="12" y="51" font-size="8" fill="#374151">${pad(coords[0].hour)}:00</text>
        <text x="${centerPt.x.toFixed(1)}" y="51" text-anchor="middle" font-size="8" font-weight="600" fill="#b91c1c">${pad(curH)}:00</text>
        <text x="228" y="51" text-anchor="end" font-size="8" fill="#166534">${pad(coords[coords.length - 1].hour)}:00</text>
      `;
    }

    async function loadForecastWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FKuching&forecast_days=1`;
        const res = await fetch(url);
        const j = await res.json();
        if (j && j.hourly && Array.isArray(j.hourly.temperature_2m)) {
          state.hourly24 = j.hourly.temperature_2m.slice(0, 24).map(v => Math.round(v));
          const probs = j.hourly.precipitation_probability || [];
          state.rainProbMax = probs.length ? Math.max(...probs.slice(0, 24)) : 0;
          updateClockAndForecastCurve();
        }
      } catch (e) {}
    }

        return;

    function wrap52(n) {
      return ((n - 1) % 52 + 52) % 52 + 1;
    }

    function isoWeek(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.min(52, Math.ceil((((date - yearStart) / 86400000) + 1) / 7));
    }

    function stepW(idx, delta) {
      const el = document.getElementById('bw' + idx);
      el.value = wrap52((parseInt(el.value, 10) || 1) + delta);
      if (idx === 1) syncW2W3();
    }

    function syncW2W3() {
      const w1 = parseInt(document.getElementById('bw1').value, 10) || 1;
      document.getElementById('bw2').value = wrap52(w1 + 16);
      document.getElementById('bw3').value = wrap52(w1 + 19);

    function startIrregularFlipEngine() {
      state.flipTimers.forEach(id => clearTimeout(id));
      state.flipTimers = [];
      const scenes = Array.from(document.querySelectorAll('.metro-flip-scene'));
      if (!scenes.length) return;

      function scheduleOne(sc) {
        const delayMs = 2400 + Math.floor(Math.random() * 5600);
        const tId = setTimeout(() => {
          if (!document.body.contains(sc)) return;
          const subs = JSON.parse(sc.dataset.subs || '[]');
          let idx = parseInt(sc.dataset.stepIdx || '0', 10) + 1;
          sc.dataset.stepIdx = String(idx);

          const flippedNow = sc.classList.toggle('is-flipped');
          const targetSlot = sc.querySelector(flippedNow ? '[data-slot="back"]' : '[data-slot="front"]');
          if (targetSlot && subs.length > 0) {
            targetSlot.textContent = subs[idx % subs.length];
          }
          scheduleOne(sc);
        }, delayMs);
        state.flipTimers.push(tId);
      }

      scenes.forEach(sc => scheduleOne(sc));
    }

    function renderQueryBox() {
      const t = DICT[state.lang];
      const p = document.getElementById('extraPanel');
      p.classList.remove('hidden');
      p.innerHTML = `
        <div class="sec-title">${t.extraHeading}</div>

        <button type="button" class="primary-btn" onclick="playTone('tap'); execQuery()">${t.searchBtn}</button>

      `;

    async function execQuery() {
      const t = DICT[state.lang];
      const ear = document.getElementById('qEarInp').value.trim();
      const tblWrap = document.getElementById('qTableResult');
      const outBox = document.getElementById('qOutBox');
      tblWrap.innerHTML = '';
      outBox.classList.remove('hidden');
      outBox.textContent = '...';

      try {
        const url = `${CONFIG.GAS_URL}?action=query&token=${encodeURIComponent(CONFIG.API_TOKEN)}&pass=${encodeURIComponent(state.profile.code)}&category=seed_yellow&ear_tag=${encodeURIComponent(ear)}&lang=${encodeURIComponent(state.lang)}&worker_name=${encodeURIComponent(state.workerName)}`;
        const r = await fetch(url);
        const j = await r.json();
        if (!j || !j.ok) {
          outBox.textContent = j?.error || 'ERR';
          return;
        }
        const cards = (j.data && j.data.cards) || [];
        if (cards.length === 0) {
          outBox.textContent = '0';
          return;
        }
        outBox.classList.add('hidden');

        // 收集所有黃色欄位標題，建立依序排列的正規表格
        const colHeaders = [];
        cards.forEach(c => {
          (c.fields || []).forEach(f => {
            const hLabel = translateQueryText(f.header);
            if (!colHeaders.includes(hLabel)) colHeaders.push(hLabel);
          });
        });

        const thCells = [`<th>${t.colEarTag}</th>`, ...colHeaders.map(h => `<th>${h}</th>`)].join('');
        const bodyRows = cards.map(c => {
          const mapVal = {};
          (c.fields || []).forEach(f => {
            mapVal[translateQueryText(f.header)] = translateQueryText(f.value);
          });
          const tdCells = [
            `<td><strong>${translateQueryText(c.earTag)}</strong></td>`,
            ...colHeaders.map(h => `<td>${mapVal[h] || '-'}</td>`)
          ].join('');
          return `<tr>${tdCells}</tr>`;
        }).join('');

        tblWrap.innerHTML = `
          <div class="lookup-table-wrap">
            <table class="lookup-table">
              <thead><tr>${thCells}</tr></thead>
              <tbody>${bodyRows}</tbody>
            </table>
          </div>
        `;
      } catch (e) {
        outBox.textContent = String(e);
      }
    }

    // 分析報表改為正規表格呈現
    async function renderAnalysisBox() {
      const p = document.getElementById('extraPanel');
      p.classList.remove('hidden');
      p.innerHTML = '<div class="notice-box">...</div>';
      try {
        const url = `${CONFIG.GAS_URL}?action=report&token=${encodeURIComponent(CONFIG.API_TOKEN)}&pass=${encodeURIComponent(state.profile.code)}&worker_name=${encodeURIComponent(state.workerName)}`;
        const r = await fetch(url);
        const j = await r.json();
        if (!j || !j.ok || !j.data) {
          p.innerHTML = `<div class="notice-box">${j?.error || '-'}</div>`;
          return;
        }
        const headers = j.data.headers || [];
        const rows = j.data.rows || [];
        if (!rows.length) {
          p.innerHTML = `<div class="notice-box">-</div>`;
          return;
        }
        const ths = headers.map(h => `<th>${translateQueryText(h)}</th>`).join('');
        const trs = rows.map(row =>
          `<tr>${row.map(v => `<td>${translateQueryText(v)}</td>`).join('')}</tr>`
        ).join('');
        p.innerHTML = `
          <div class="lookup-table-wrap">
            <table class="lookup-table">
              <thead><tr>${ths}</tr></thead>
              <tbody>${trs}</tbody>
            </table>
          </div>
        `;
      } catch (e) {
        p.innerHTML = `<div class="notice-box">${String(e)}</div>`;
      }
    }

    function chips(key, opts, multi) {
      state.chips[key] = multi ? [] : '';
      let h = '<div class="chip-row">';
      opts.forEach(o => {
        const v = typeof o === 'object' ? o.v : o;
        const l = typeof o === 'object' ? o.l : o;
        h += `<button type="button" class="chip-btn" data-g="${key}" data-v="${v}" data-m="${multi ? '1' : '0'}" onclick="toggleChip(this)">${l}</button>`;
      });
      h += '</div>';
      return h;
    }

    function toggleChip(btn) {
      playTone('tap');
      const g = btn.dataset.g;
      const v = btn.dataset.v;
      const m = btn.dataset.m === '1';
      if (m) {
        btn.classList.toggle('selected');
        const arr = state.chips[g] || [];
        const i = arr.indexOf(v);
        if (i >= 0) arr.splice(i, 1);
        else arr.push(v);
        state.chips[g] = arr;
      } else {
        document.querySelectorAll(`.chip-btn[data-g="${g}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.chips[g] = v;
      }
    }

    function validateMultiEarString(rawStr) {
      const s = String(rawStr || '').trim();
      if (!s) return true;
      if (/\s+/.test(s) && !s.includes(',') && !s.includes('.')) {
        return false;
      }
      return true;
    }

          <div class="field-block"><label class="field-label">${t.lblPigCat}</label>${chips('pig_category', [{v:'Boar',l:t.optCatBoar},{v:'Sow',l:t.optCatSow},{v:'Piglet',l:t.optCatPiglet},{v:'Porker',l:t.optCatPorker}], false)}</div>
          <div class="field-block"><label class="field-label">Source Wing / Room</label><input type="text" id="f_source_room" class="input-box" placeholder="e.g. PA1A / F2 / GA" /></div>
          <div class="field-block"><label class="field-label">${t.lblAffCount}</label><input type="number" id="f_head_count" class="input-box" /></div>
          <div class="field-block">
            <label class="field-label">${t.lblEarTag}</label>
            <div class="field-hint">${t.lblMultiEarHint}</div>
            <textarea id="f_ear_tags_list" rows="2" class="input-box" placeholder="L1123, L1124"></textarea>
          </div>
          <div class="field-block"><label class="field-label">${t.lblTotalWt}</label><input type="number" step="0.1" id="f_total_weight_kg" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblNote}</label><input type="text" id="f_brief_note" class="input-box" /></div>
        `;
      }

      html += `
        <button type="button" class="secondary-btn" onclick="addNextEntryToQueue()">${t.addNextBtn}</button>
        <div id="queuedCartBox" class="cart-list-box ${state.queuedRecords.length ? '' : 'hidden'}"></div>
        <button type="button" class="primary-btn" id="btnSendForm" onclick="submitAllQueuedAndCurrent()">${t.submitAllBtn}</button>
        <div id="stageTracker" class="stage-tracker hidden"></div>
      `;
      panel.innerHTML = html;
      refreshCartUI();
    }

    async function collectCurrentFormItem() {
      const t = DICT[state.lang];
      const data = {};
      document.querySelectorAll('#formPanel [id^="f_"]').forEach(el => {
        if (el.type === 'file') return;
        data[el.id.replace(/^f_/, '')] = el.value;
      });
      Object.keys(state.chips).forEach(k => { data[k] = state.chips[k]; });

      const multiFields = ['ear_tags_list', 'deferred_sow_tags'];
      for (const mf of multiFields) {
        if (data[mf] && !validateMultiEarString(data[mf])) {
          alert(t.errCommaDot);
          playTone('error');
          return null;
        }
      }

      if (state.view.formType === 'gestation' && data.breeding_date) {
        const nowTime = new Date().toTimeString().slice(0, 8);
        data.breeding_datetime_hidden = `${data.breeding_date} ${nowTime}`;
      }
      if (state.view.formType.startsWith('farr_')) {
        data.sub_action = state.view.formType;
      }
      if (state.view.formType === 'treatment' || state.view.formType === 'mortality') {
        data.event_type = state.view.formType;
      }

      let photo = null;
      const photoInput = document.getElementById('f_photo_file');
      if (photoInput && photoInput.files && photoInput.files[0]) {
        photo = await compressPhoto(photoInput.files[0]);
      }

      return { data, photo };
    }

    function hasAnyInputData(dataObj) {
      const ignoreKeys = new Set(['record_date', 'wean_date', 'collection_date', 'test_date']);
      return Object.keys(dataObj).some(k => {
        if (ignoreKeys.has(k)) return false;
        const v = dataObj[k];
        if (Array.isArray(v)) return v.length > 0;
        return String(v || '').trim() !== '';
      });
    }

    async function addNextEntryToQueue() {
      const item = await collectCurrentFormItem();
      if (!item) return;
      if (!hasAnyInputData(item.data)) return;

      state.queuedRecords.push(item);
      playTone('tap');
      logTraj('add_next:' + state.queuedRecords.length);

      document.querySelectorAll('#formPanel [id^="f_"]').forEach(el => {
        if (el.type === 'date') return;
        if (el.type === 'file') { el.value = ''; return; }
        el.value = '';
      });
      document.querySelectorAll('#formPanel .chip-btn.selected').forEach(b => b.classList.remove('selected'));
      Object.keys(state.chips).forEach(k => {
        state.chips[k] = Array.isArray(state.chips[k]) ? [] : '';
      });

      refreshCartUI();
    }

    function removeQueuedItem(idx) {
      playTone('tap');
      state.queuedRecords.splice(idx, 1);
      refreshCartUI();
    }

    function refreshCartUI() {
      const t = DICT[state.lang];
      const box = document.getElementById('queuedCartBox');
      if (!box) return;
      if (state.queuedRecords.length === 0) {
        box.classList.add('hidden');
        return;
      }
      box.classList.remove('hidden');
      box.innerHTML = `<div style="font-size:13px; font-weight:600;">${t.queuedListTitle} (${state.queuedRecords.length})</div>` +
        state.queuedRecords.map((rec, i) => {
          const d = rec.data;
          const label = d.ear_tag || d.sow_ear_tag || d.boar_ear_tag || d.ear_tags_list || d.litter_pen_location || ('#' + (i + 1));
          return `<div class="cart-item"><span>#${i + 1} · ${label}</span><button type="button" class="del-mini-btn" onclick="removeQueuedItem(${i})">${t.delBtn}</button></div>`;
        }).join('');
    }

    function setStageUI(el, cls, text) {
      el.className = 'stage-tracker ' + cls;
      el.classList.remove('hidden');
      el.textContent = text;
    }

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const maxDim = CONFIG.MAX_IMG_PX;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mimeType: 'image/jpeg', base64: c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY) });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function submitAllQueuedAndCurrent() {
      const t = DICT[state.lang];
      if (!state.workerName) {
        alert(t.errNoName);
        playTone('error');
        return;
      }

      const currentItem = await collectCurrentFormItem();
      if (!currentItem) return;

      const allToSend = [...state.queuedRecords];
      if (hasAnyInputData(currentItem.data)) {
        allToSend.push(currentItem);
      }
      if (allToSend.length === 0) return;

      const btn = document.getElementById('btnSendForm');
      const stEl = document.getElementById('stageTracker');
      btn.disabled = true;
      setStageUI(stEl, 'st-prep', t.step1Prep);

      const ft = state.view.formType;
      let backendModule = 'daily_fw';
      if (ft === 'daily_fw') backendModule = 'daily_fw';
      else if (ft === 'conformation') backendModule = 'conformation';
      else if (ft === 'gestation') backendModule = 'gestation';
      else if (ft.startsWith('farr_')) backendModule = 'farrowing';
      else if (ft === 'boar_semen') backendModule = 'boar_semen';
      else if (ft === 'malformation') backendModule = 'malformation_disease';
      else if (ft === 'treatment' || ft === 'mortality') backendModule = 'treatment_mortality';
      else if (ft === 'exit_sales') backendModule = 'exit_sales';

      setStageUI(stEl, 'st-sending', t.step2Send);
      logTraj('submit_batch:' + backendModule + 'x' + allToSend.length);

      const payload = {
        token: CONFIG.API_TOKEN,
        module: backendModule,
        common: {
          farm_mode: state.profile.group,
          wing: state.view.wing,
          room: state.view.room,
          location: [state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' / '),
          batch: state.currentBatch,
          module: backendModule
        },
        records: allToSend,
        meta: {
          worker_name: state.workerName,
          entered_at: state.enteredAt,
          submitted_at: new Date().toISOString(),
          dwell_seconds: Math.max(1, Math.round((Date.now() - state.enteredMs) / 1000)),
          ui_lang: state.lang,
          role_level: state.profile.level,
          device_summary: /mobile|android|iphone|ipad/i.test(navigator.userAgent) ? 'Mobile/Tablet' : 'Desktop',
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height + '@' + (window.devicePixelRatio || 1),
          trajectory_summary: state.trajectory.join(' -> '),
          offline_queued: false
        }
      };

      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const j = await res.json();
        if (j && j.ok) {
          setStageUI(stEl, 'st-done', t.step3Done + (j.rowId || 'OK') + ` (${allToSend.length})`);
          playTone('send');
          state.queuedRecords = [];
          refreshCartUI();
          renderSymmetricalDiaryReport(allToSend);
        } else {
          throw new Error(j && j.error ? j.error : 'ERR');
        }
      } catch (e) {
        payload.meta.offline_queued = true;
        const q = getQueue();
        q.push(payload);
        localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(q));
        refreshQueuePill();
        setStageUI(stEl, 'st-queued', t.step3Queued);
        playTone('step');
        renderSymmetricalDiaryReport(allToSend);
      }
      btn.disabled = false;
    }

    function renderSymmetricalDiaryReport(records) {
      const t = DICT[state.lang];
      const diaryPanel = document.getElementById('diaryPanel');
      diaryPanel.classList.remove('hidden');

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const ymd = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
      const displayDt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

      let waterM3 = 0, waterL = 0, feedBags = 0, feedKg = 0, headCnt = 0, mortCnt = 0;
      const mortTags = [];
      records.forEach(r => {
        const d = r.data || {};
        const am = parseFloat(d.water_meter_am);
        const pm = parseFloat(d.water_meter_pm);
        if (!isNaN(am) && !isNaN(pm) && pm >= am) {
          waterM3 += (pm - am);
          waterL += (pm - am) * 1000;
        }
        const bags = parseFloat(d.feed_bags);
        if (!isNaN(bags)) {
          feedBags += bags;
          feedKg += bags * 50;
        }
        const hc = parseInt(d.head_count, 10);
        if (!isNaN(hc)) headCnt += hc;
        if (d.event_type === 'mortality' || d.exit_reason === 'Mortality') {
          const ac = parseInt(d.affected_count || d.head_count || '1', 10) || 1;
          mortCnt += ac;
          if (d.ear_tags_list) mortTags.push(d.ear_tags_list);
        }
      });

      const activeKey = `${state.view.dept}_${state.view.wing || 'SINGLE'}`;
      const roomLabel = [state.profile.group, state.view.wing, state.view.room].filter(Boolean).join('-');
      const activeSummaryLines = [
        `${roomLabel} (${records.length})`,
        headCnt ? `Heads: ${headCnt}` : '',
        waterM3 > 0 ? `Water: ${waterM3.toFixed(1)} m³ (${waterL.toFixed(1)} L)` : '',
        feedBags > 0 ? `Feed: ${feedBags} bags (${feedKg.toFixed(1)} kg)` : '',
        mortCnt > 0 ? `Mort: ${mortCnt} [${mortTags.join(',')}]` : ''
      ].filter(Boolean);

      const symZones = [
        { key: 'Boar House_SINGLE', title: 'Boar House', color: '#d1d5db' },
        { key: 'GDU_SINGLE', title: 'GDU', color: '#ede9fe' },
        { key: 'Gestation_A', title: 'Gestation A', color: '#fee2e2' },
        { key: 'Gestation_B', title: 'Gestation B', color: '#fee2e2' },
        { key: 'Farrowing_A', title: 'Farrowing A', color: '#dcfce7' },
        { key: 'Farrowing_B', title: 'Farrowing B', color: '#dcfce7' },
        { key: 'Nursery_A', title: 'Nursery A', color: '#fef9c3' },
        { key: 'Nursery_B', title: 'Nursery B', color: '#fef9c3' },
        { key: 'Porker_A', title: 'Porker A (1A-8B)', color: '#e5e7eb' },
        { key: 'Porker_B', title: 'Porker B (1A-8B)', color: '#e5e7eb' }
      ];

      state.lastDiarySummary = {
        fileName: `${ymd} ${roomLabel || 'Room'} diary report.png`,
        displayDt,
        workerName: state.workerName,
        activeKey,
        activeSummaryLines,
        symZones,
        isExit: ['CullMort', 'ExitSale'].includes(state.view.dept)
      };

      const cellsHtml = symZones.map(z => {
        const isAct = z.key === activeKey;
        const bg = isAct ? z.color : '#f3f4f6';
        const bodyTxt = isAct ? activeSummaryLines.join('<br>') : '-';
        return `<div class="diary-cell ${isAct ? 'active-zone' : ''}" style="background:${bg};">
          <div class="diary-cell-title">${z.title}</div>
          <div>${bodyTxt}</div>
        </div>`;
      }).join('');

      const exitActive = ['CullMort', 'ExitSale'].includes(state.view.dept);
      diaryPanel.innerHTML = `
        <div class="sec-title">${t.diaryHeader}</div>
        <div class="field-hint">${t.diaryRemind}</div>
        <div class="diary-report-card">
          <div class="diary-top-dt">${displayDt}</div>
          <div class="diary-sym-grid">${cellsHtml}</div>
          <div class="diary-cell ${exitActive ? 'active-zone' : ''}" style="margin-top:6px; background:${exitActive ? '#ffedd5' : '#f3f4f6'};">
            <div class="diary-cell-title">Cull / Mortality & Exit / Sales</div>
            <div>${exitActive ? activeSummaryLines.join('<br>') : '-'}</div>
          </div>
          <div class="diary-footer-sign">
            <span>${state.workerName}</span>
            <span>${displayDt}</span>
          </div>
        </div>
        <button type="button" class="primary-btn" onclick="downloadDiaryPng()">${t.downloadPngBtn}</button>
      `;
    }

    function downloadDiaryPng() {
      const info = state.lastDiarySummary;
      if (!info) return;
      const canvas = document.createElement('canvas');
      canvas.width = 720;
      canvas.height = 920;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#4b5563';
      ctx.lineWidth = 3;
      ctx.strokeRect(16, 16, 688, 888);

      ctx.fillStyle = '#111827';
      ctx.font = '600 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(info.displayDt, 360, 60);

      const colW = 326, rowH = 122, gapX = 16, gapY = 12;
      info.symZones.forEach((z, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const x = 26 + col * (colW + gapX);
        const y = 86 + row * (rowH + gapY);
        const isAct = z.key === info.activeKey;

        ctx.fillStyle = isAct ? z.color : '#f3f4f6';
        ctx.fillRect(x, y, colW, rowH);
        ctx.strokeStyle = isAct ? '#1f2937' : '#cbd5e1';
        ctx.lineWidth = isAct ? 2.5 : 1.5;
        ctx.strokeRect(x, y, colW, rowH);

        ctx.textAlign = 'left';
        ctx.fillStyle = isAct ? '#111827' : '#6b7280';
        ctx.font = '600 17px sans-serif';
        ctx.fillText(z.title, x + 12, y + 28);

        if (isAct) {
          ctx.font = '500 14px sans-serif';
          info.activeSummaryLines.forEach((line, li) => {
            ctx.fillText(line, x + 12, y + 52 + li * 20);
          });
        }
      });

      const exY = 86 + 5 * (rowH + gapY);
      ctx.fillStyle = info.isExit ? '#ffedd5' : '#f3f4f6';
      ctx.fillRect(26, exY, 668, 86);
      ctx.strokeStyle = info.isExit ? '#1f2937' : '#cbd5e1';
      ctx.strokeRect(26, exY, 668, 86);
      ctx.textAlign = 'left';
      ctx.fillStyle = info.isExit ? '#111827' : '#6b7280';
      ctx.font = '600 17px sans-serif';
      ctx.fillText('Cull / Mortality & Exit / Sales', 38, exY + 28);
      if (info.isExit) {
        ctx.font = '500 14px sans-serif';
        ctx.fillText(info.activeSummaryLines.join(' | '), 38, exY + 56);
      }

      ctx.fillStyle = '#111827';
      ctx.font = '600 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(info.workerName, 28, 882);
      ctx.textAlign = 'right';
      ctx.fillText(info.displayDt, 692, 882);

      const link = document.createElement('a');
      link.download = info.fileName;
      link.href = canvas.toDataURL('image/png');
      link.click();
      playTone('send');
    }

    function getQueue() {
      try { return JSON.parse(localStorage.getItem(CONFIG.KEYS.QUEUE) || '[]'); }
      catch (e) { return []; }
    }

    function refreshQueuePill() {
      const q = getQueue();
      const el = document.getElementById('queuePill');
      if (q.length > 0) {
        el.textContent = q.length;
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    async function syncOfflineQueue() {
      const q = getQueue();
      if (!q.length) return;
      const keep = [];
      for (const item of q) {
        try {
          const res = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(item)
          });
          const j = await res.json();
          if (!j || !j.ok) keep.push(item);
        } catch (e) {
          keep.push(item);
        }
      }
      localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(keep));
      refreshQueuePill();
    }

    window.addEventListener('online', syncOfflineQueue);

    (function init() {
      state.soundOn = localStorage.getItem(CONFIG.KEYS.SOUND) !== '0';
      state.workerName = localStorage.getItem(CONFIG.KEYS.WORKER) || '';
      document.getElementById('loginWorkerInput').value = state.workerName;

      state.lang = detectSystemLang();
      document.documentElement.lang = state.lang;
      document.querySelectorAll('.soft-pill[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
      applyTexts();
      updateClockAndForecastCurve();
      setInterval(updateClockAndForecastCurve, 1000);
      loadForecastWeather();
      refreshQueuePill();
      logTraj('init');

      const savedPass = localStorage.getItem(CONFIG.KEYS.PASS);
      if (savedPass && state.workerName) {
        const prof = parsePass(savedPass);
        if (prof) {
          state.profile = prof;
          openWorkspace();
        }
      }
    })();
  </script>
