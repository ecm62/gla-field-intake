<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e8eef6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GLA Field Hub</title>
  <style>
    /* === [START MODULE 3: SOFT METRO TILES, COMPACT PIXEL WIDGET & RAIL NAV] === */
    :root {
      --text-primary: #0f172a;
      --text-secondary: #475569;

      --tile-gp: #ede7f6;
      --tile-gp-b: #b39ddb;
      --tile-ps: #e8f5e9;
      --tile-ps-b: #81c784;
      --tile-gest: #e0f2f1;
      --tile-gest-b: #80cbc4;
      --tile-farr: #ffebee;
      --tile-farr-b: #ef9a9a;
      --tile-nurs: #fffde7;
      --tile-nurs-b: #fff176;
      --tile-pork: #eceff1;
      --tile-pork-b: #b0bec5;
      --tile-boar: #cfd8dc;
      --tile-boar-b: #90a4ae;
      --tile-gdu: #f3e5f5;
      --tile-gdu-b: #ce93d8;
      --tile-maint: #fff3e0;
      --tile-maint-b: #ffcc80;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 16px 74px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #e8eef6 0%, #f7f9fc 100%);
      color: var(--text-primary);
      font-size: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 左右側邊細長條 + 半隱形三角形 */
    .edge-rail {
      position: fixed;
      top: 0;
      bottom: 56px;
      width: 14px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.035);
      cursor: pointer;
    }
    .edge-rail:active { background: rgba(2, 132, 199, 0.16); }
    .edge-rail.left { left: 0; }
    .edge-rail.right { right: 0; }

    .tri-ghost {
      width: 0;
      height: 0;
      opacity: 0.22;
    }
    .edge-rail:active .tri-ghost { opacity: 0.65; }
    .tri-left {
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 7px solid #334155;
    }
    .tri-right {
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 7px solid #334155;
    }

    /* 頂部控制列：BM -> EN -> 中 */
    .top-bar {
      max-width: 960px;
      margin: 10px auto 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pill-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .pill-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    /* 緊湊型 Google 手機桌面時鐘、地點與溫度曲線框 */
    .compact-widget {
      max-width: 960px;
      margin: 8px auto 12px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 12px 15px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
      border: 1px solid #e2e8f0;
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .time-date-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .clock-text {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
    }

    .date-loc-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .rain-temp-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      padding: 5px 11px;
      border-radius: 14px;
    }

    .now-temp-badge {
      font-size: 18px;
      font-weight: 800;
      color: #0369a1;
    }

    .rain-badge {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .curve-box {
      margin-top: 8px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 6px 10px 4px 10px;
      border: 1px solid #eef2f6;
    }

    .curve-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 2px;
    }

    .span-toggle {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 8px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 密碼驗證框（零密碼暗示） */
    .auth-card {
      max-width: 420px;
      margin: 24px auto;
      background: #ffffff;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 6px 22px rgba(15, 23, 42, 0.07);
      border: 1px solid #e2e8f0;
    }

    .field-label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1e293b;
    }

    .input-box, .select-box {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
    }

    .primary-btn {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 15px;
      background: #0284c7;
      color: #ffffff;
      cursor: pointer;
    }

    /* 主工作區與房號批次提醒條 */
    .main-wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    .context-banner {
      background: #ffffff;
      border: 1.5px solid #bae6fd;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }

    .batch-pill {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 三週次批次三個獨立框 */
    .batch-trio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
    }

    .batch-cell {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 10px;
      text-align: center;
    }

    .batch-cell label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }

    .batch-stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .step-mini-btn {
      width: 32px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .batch-num-input {
      width: 54px;
      height: 38px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      border: 1px solid #94a3b8;
      border-radius: 10px;
      background: #fff;
    }

    /* 柔和圓弧動態磚 */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    @media (min-width: 680px) {
      .tile-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @keyframes metroFlipPulse {
      0% { transform: perspective(700px) rotateX(0deg) scale(1); }
      45% { transform: perspective(700px) rotateX(14deg) scale(0.985); }
      100% { transform: perspective(700px) rotateX(0deg) scale(1); }
    }

    .live-tile {
      border-radius: 22px;
      padding: 16px;
      min-height: 114px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid transparent;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      transition: transform 0.14s ease;
      user-select: none;
    }

    .live-tile:active { transform: scale(0.96); }
    .live-tile.flipping { animation: metroFlipPulse 0.72s ease; }

    .tile-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.25;
      color: #0f172a;
    }

    .tile-sub {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-top: 6px;
    }

    .tile-badge {
      align-self: flex-end;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      color: #1e293b;
      margin-top: 8px;
    }

    .t-gp { background: var(--tile-gp); border-color: var(--tile-gp-b); }
    .t-ps { background: var(--tile-ps); border-color: var(--tile-ps-b); }
    .t-gest { background: var(--tile-gest); border-color: var(--tile-gest-b); }
    .t-farr { background: var(--tile-farr); border-color: var(--tile-farr-b); }
    .t-nurs { background: var(--tile-nurs); border-color: var(--tile-nurs-b); }
    .t-pork { background: var(--tile-pork); border-color: var(--tile-pork-b); }
    .t-boar { background: var(--tile-boar); border-color: var(--tile-boar-b); }
    .t-gdu { background: var(--tile-gdu); border-color: var(--tile-gdu-b); }
    .t-maint { background: var(--tile-maint); border-color: var(--tile-maint-b); }

    .section-spacer { height: 22px; }
    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin: 4px 0 8px 2px;
      color: #1e293b;
    }

    .panel-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 18px;
      margin-top: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .field-block { margin-bottom: 14px; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      padding: 10px 13px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 13px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }

    .chip-btn.selected {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .notice-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f1f5f9;
      font-size: 15px;
      font-weight: 600;
      white-space: pre-wrap;
    }

    /* 底部模擬手機上一頁／下一頁導航列 */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding: 0 12px;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      height: 40px;
      border-radius: 13px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden { display: none !important; }
    /* === [END MODULE 3] === */
  </style>
</head>
<body>
  <!-- 左右側邊細長條 + 半隱形三角形 -->
  <div class="edge-rail left" onclick="goPrev()">
    <div class="tri-ghost tri-left"></div>
  </div>
  <div class="edge-rail right" onclick="goNext()">
    <div class="tri-ghost tri-right"></div>
  </div>

  <!-- 頂部語系按鈕：BM -> EN -> 中 -->
  <div class="top-bar">
    <div class="pill-group">
      <button type="button" class="pill-btn" data-lang="ms" onclick="setLang('ms')">BM</button>
      <button type="button" class="pill-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="pill-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">中</button>
    </div>
    <div class="pill-group">
      <span id="rolePill" class="pill-btn" style="cursor:default;">-</span>
      <span id="queuePill" class="pill-btn hidden" style="background:#f59e0b; color:#fff; border-color:#f59e0b;" onclick="syncOfflineQueue()">0</span>
      <button type="button" class="pill-btn" id="btnSwitchCode" onclick="promptSwitchCode()"></button>
      <button type="button" class="pill-btn" id="btnResetMem" onclick="resetMemory()"></button>
    </div>
  </div>

  <!-- 緊湊型時鐘、日期、地點、天氣雨情與溫度變化曲線（含現在時間指示針） -->
  <section class="compact-widget">
    <div class="widget-header">
      <div class="time-date-wrap">
        <div class="clock-text" id="clockNow">--:--:--</div>
        <div class="date-loc-text" id="dateLocLine">--</div>
      </div>
      <div class="rain-temp-wrap">
        <div class="now-temp-badge" id="tempNowBadge">--°C</div>
        <div class="rain-badge" id="rainBadge">--</div>
      </div>
    </div>
    <div class="curve-box">
      <div class="curve-top-bar">
        <span id="curveHeading"></span>
        <button type="button" class="span-toggle" id="btnToggleSpan" onclick="toggleCurveSpan()">6H / 12H</button>
      </div>
      <svg id="hourlyCurveSvg" viewBox="0 0 360 68" width="100%" height="68"></svg>
    </div>
  </section>

  <!-- 密碼登入畫面（零密碼暗示，按 Enter 直接登入） -->
  <section id="loginCard" class="auth-card">
    <label class="field-label" id="lblPass" for="inpPass"></label>
    <input type="password" id="inpPass" class="input-box" autocomplete="off" onkeydown="if(event.key==='Enter') submitLogin();" />
    <button type="button" class="primary-btn" id="btnLogin" onclick="submitLogin()"></button>
    <div id="errLogin" class="notice-box hidden" style="background:#fee2e2; color:#991b1b;"></div>
  </section>

  <!-- 主工作區 -->
  <main id="workspaceMain" class="main-wrap hidden">
    <!-- 目前所在房號與三週次批次提醒橫幅 -->
    <div class="context-banner">
      <span id="locBannerText">-</span>
      <span id="batchBannerBtn" class="batch-pill hidden" onclick="reopenBatchGate()"></span>
    </div>

    <!-- 上方動態磚網格 -->
    <div id="topGrid" class="tile-grid"></div>

    <!-- 間隔 -->
    <div class="section-spacer"></div>

    <!-- 下方分析與查詢方塊（依密碼層級顯示） -->
    <div id="bottomTitle" class="section-title hidden"></div>
    <div id="bottomGrid" class="tile-grid"></div>

    <!-- 表單面板 -->
    <div id="formPanel" class="panel-card hidden"></div>
    <!-- 額外查詢/分析面板 -->
    <div id="extraPanel" class="panel-card hidden"></div>
  </main>

  <!-- 底部模擬手機上一頁／下一頁導航列 -->
  <nav class="bottom-nav">
    <button type="button" class="nav-btn" id="btnNavPrev" onclick="goPrev()"></button>
    <button type="button" class="nav-btn" id="btnNavNext" onclick="goNext()"></button>
  </nav>

    const state = {
      lang: 'ms',

      enteredAt: new Date().toISOString(),

      curveSpan: 12, // 6 or 12 hours
      hourly24: Array.from({ length: 24 }, (_, h) => Math.round(25 + 6 * Math.sin(((h - 6) / 24) * Math.PI * 2))),
      rainProbMax: 40,
      view: {
        stage: 'depts', // 'depts' | 'wing' | 'room' | 'batch_gate' | 'room_tiles' | 'form'
        dept: '',

    function detectSystemLang() {
      const saved = localStorage.getItem(CONFIG.KEYS.LANG);
      if (saved && DICT[saved]) return saved;
      const rawList = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'ms'];
      for (const item of rawList) {
        const low = String(item).toLowerCase();
        if (low.startsWith('ms') || low.includes('may') || low.includes('my')) return 'ms';
        if (low.startsWith('en')) return 'en';
        if (low.startsWith('zh')) return 'zh-TW';
      }
      return 'ms';
    }

    function setLang(langCode) {
      if (!DICT[langCode]) return;
      state.lang = langCode;
      document.documentElement.lang = langCode;
      localStorage.setItem(CONFIG.KEYS.LANG, langCode);
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === langCode));
      logTraj('lang:' + langCode);
      applyStaticTranslations();
      updateClockAndCurve();
      if (state.profile) renderView();
    }

    function applyStaticTranslations() {
      const t = DICT[state.lang];
      document.getElementById('lblPass').textContent = t.passLabel;
      document.getElementById('btnLogin').textContent = t.enterBtn;
      document.getElementById('btnSwitchCode').textContent = t.switchCode;
      document.getElementById('btnResetMem').textContent = t.resetMem;
      document.getElementById('btnNavPrev').textContent = '◀ ' + t.prevBtn;
      document.getElementById('btnNavNext').textContent = t.nextBtn + ' ▶';
      document.getElementById('bottomTitle').textContent = t.extraHeading;
      document.getElementById('curveHeading').textContent = state.curveSpan === 6 ? t.curve6h : t.curve12h;
    }

    function toggleCurveSpan() {
      state.curveSpan = state.curveSpan === 12 ? 6 : 12;
      applyStaticTranslations();
      updateClockAndCurve();
    }

    function logTraj(step) {
      const sec = Math.round((Date.now() - state.enteredMs) / 1000);
      state.trajectory.push(sec + 's:' + step);
      if (state.trajectory.length > 50) state.trajectory.shift();
    }

    function resolvePass(raw) {
      const p = String(raw || '').trim().toLowerCase();
      if (p === CONFIG.PASSWORDS.ps_basic) return { group: 'PS', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.ps_query) return { group: 'PS', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.ps_report) return { group: 'PS', level: 'report', code: p };
      if (p === CONFIG.PASSWORDS.gp_basic) return { group: 'GP', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.gp_query) return { group: 'GP', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.admin) return { group: 'PS', level: 'admin', code: p };
      return null;
    }

    function submitLogin() {
      const raw = document.getElementById('inpPass').value;
      const prof = resolvePass(raw);
      const err = document.getElementById('errLogin');
      if (!prof) {
        err.textContent = DICT[state.lang].badPass;
        err.classList.remove('hidden');
        return;
      }
      err.classList.add('hidden');
      state.profile = prof;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      logTraj('login:' + prof.group + ':' + prof.level);
      openWorkspace();
    }

    function promptSwitchCode() {
      const p = prompt(DICT[state.lang].passLabel);
      if (p === null) return;
      const prof = resolvePass(p);
      if (!prof) {
        alert(DICT[state.lang].badPass);
        return;
      }
      state.profile = prof;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      state.view = { stage: 'depts', dept: '', wing: '', room: '', formType: '' };
      state.history = [];
      state.redoStack = [];
      openWorkspace();
    }

    function resetMemory() {
      localStorage.removeItem(CONFIG.KEYS.PASS);
      state.profile = null;
      document.getElementById('workspaceMain').classList.add('hidden');
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('inpPass').value = '';
      document.getElementById('rolePill').textContent = '-';
    }

    function openWorkspace() {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('workspaceMain').classList.remove('hidden');
      document.getElementById('rolePill').textContent = state.profile.group + ' · ' + state.profile.level.toUpperCase();
      renderView();
    }

    // 時鐘、日期與逐時溫度曲線（含現在時間點指示針）
    function updateClockAndCurve() {
      const t = DICT[state.lang];
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const curH = now.getHours();
      const curM = now.getMinutes();

      document.getElementById('clockNow').textContent = `${pad(curH)}:${pad(curM)}:${pad(now.getSeconds())}`;
      document.getElementById('dateLocLine').textContent =
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} · ${t.locationName}`;

      const nowTemp = state.hourly24[curH] !== undefined ? state.hourly24[curH] : 29;
      document.getElementById('tempNowBadge').textContent = nowTemp + '°C';
      document.getElementById('rainBadge').textContent =
        (state.rainProbMax >= 50 ? t.rainLikely : t.rainLow) + ` (${state.rainProbMax}%)`;

      const span = state.curveSpan;
      const startH = Math.max(0, curH - (span - 1));
      const hoursList = [];
      for (let h = startH; h <= curH; h++) {
        hoursList.push({ hour: h, temp: state.hourly24[h] ?? nowTemp });
      }
      if (hoursList.length < 2) {
        hoursList.unshift({ hour: Math.max(0, curH - 1), temp: nowTemp });
      }

      const temps = hoursList.map(x => x.temp);
      const minT = Math.min(...temps) - 1;
      const maxT = Math.max(...temps) + 1;

      const pts = hoursList.map((item, idx) => {
        const x = 18 + (idx / (hoursList.length - 1)) * 316;
        const y = 50 - ((item.temp - minT) / Math.max(1, maxT - minT)) * 34;
        return { x, y, hour: item.hour, temp: item.temp };
      });

      const lastPt = pts[pts.length - 1];
      const dLine = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
      const dArea = dLine + ` L${lastPt.x.toFixed(1)},56 L${pts[0].x.toFixed(1)},56 Z`;

      const svg = document.getElementById('hourlyCurveSvg');
      svg.innerHTML = `
        <defs>
          <linearGradient id="gTemp" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="${dArea}" fill="url(#gTemp)"></path>
        <path d="${dLine}" fill="none" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round"></path>
        ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="#0369a1"></circle>`).join('')}
        <!-- 現在時間指示針 -->
        <line x1="${lastPt.x.toFixed(1)}" y1="8" x2="${lastPt.x.toFixed(1)}" y2="58" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="3,2"></line>
        <circle cx="${lastPt.x.toFixed(1)}" cy="${lastPt.y.toFixed(1)}" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"></circle>
        <text x="${Math.min(285, lastPt.x - 18).toFixed(1)}" y="11" font-size="10" font-weight="800" fill="#dc2626">${t.nowTag} ${pad(curH)}:${pad(curM)} (${nowTemp}°)</text>
        <text x="14" y="65" font-size="10" fill="#64748b">${pad(hoursList[0].hour)}:00</text>
        <text x="${(lastPt.x - 14).toFixed(1)}" y="65" font-size="10" font-weight="700" fill="#0f172a">${pad(curH)}:00</text>
      `;
    }

    async function loadHourlyWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FKuching&forecast_days=1`;
        const res = await fetch(url);
        const json = await res.json();
        if (json && json.hourly && Array.isArray(json.hourly.temperature_2m)) {
          state.hourly24 = json.hourly.temperature_2m.slice(0, 24).map(v => Math.round(v));
          const probs = json.hourly.precipitation_probability || [];
          state.rainProbMax = probs.length ? Math.max(...probs.slice(0, 24)) : 0;
          updateClockAndCurve();
        }
      } catch (e) {}
    }

    // 導航前進/後退
    function pushNavHistory() {
      state.history.push(JSON.parse(JSON.stringify(state.view)));
      state.redoStack = [];
    }

    function goPrev() {
      if (!state.history.length) return;
      state.redoStack.push(JSON.parse(JSON.stringify(state.view)));
      state.view = state.history.pop();
      logTraj('nav:prev');
      renderView();
    }

    function goNext() {
      if (!state.redoStack.length) return;
      state.history.push(JSON.parse(JSON.stringify(state.view)));
      state.view = state.redoStack.pop();
      logTraj('nav:next');
      renderView();
    }

    // 房號批次記憶
    function getRoomKey() {
      return [state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean).join('_');
    }

    function loadSavedRoomBatch() {
      try {
        const map = JSON.parse(localStorage.getItem(CONFIG.KEYS.ROOM_BATCHES) || '{}');
        return map[getRoomKey()] || null;
      } catch (e) { return null; }
    }

    function saveRoomBatch(bObj) {
      try {
        const map = JSON.parse(localStorage.getItem(CONFIG.KEYS.ROOM_BATCHES) || '{}');
        map[getRoomKey()] = bObj;
        localStorage.setItem(CONFIG.KEYS.ROOM_BATCHES, JSON.stringify(map));
      } catch (e) {}
    }

    function reopenBatchGate() {
      if (!state.view.dept) return;
      pushNavHistory();
      state.view.stage = 'batch_gate';
      renderView();
    }

    function renderView() {
      const t = DICT[state.lang];
      const topGrid = document.getElementById('topGrid');
      const botGrid = document.getElementById('bottomGrid');
      const botTitle = document.getElementById('bottomTitle');
      const formPanel = document.getElementById('formPanel');
      const extraPanel = document.getElementById('extraPanel');

      topGrid.innerHTML = '';
      botGrid.innerHTML = '';
      formPanel.classList.add('hidden');
      extraPanel.classList.add('hidden');

      const locParts = [state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean);
      document.getElementById('locBannerText').textContent = locParts.join(' › ');

      const batchPill = document.getElementById('batchBannerBtn');
      if (state.view.room || (state.view.dept && state.view.stage !== 'depts' && state.view.stage !== 'wing' && state.view.stage !== 'room')) {
        const bStr = [state.currentBatch.w1, state.currentBatch.w2, state.currentBatch.w3].filter(Boolean).join('/');
        batchPill.textContent = (bStr ? `Batch: ${bStr} · ` : '') + t.tapToChangeBatch;
        batchPill.classList.remove('hidden');
      } else {
        batchPill.classList.add('hidden');
      }

      // 下方分析與查詢方塊
      if (['query', 'report', 'admin'].includes(state.profile.level)) {
        botTitle.classList.remove('hidden');
        botGrid.appendChild(createTile(t.deptFarr + ' Analysis', t.extraHeading, 'A1', 't-farr', () => {
          showExtraNotice('Farrowing Analytics');
        }));
        botGrid.appendChild(createTile('Query Hub', t.extraHeading, 'Q1', 't-gp', () => {
          showExtraNotice('Sow & Boar Query Hub');
        }));
        if (state.profile.level === 'admin') {
          botGrid.appendChild(createTile('Admin Log', 'QWERT', 'SYS', 't-boar', () => {
            showExtraNotice(JSON.stringify({
              enteredAt: state.enteredAt,
              dwellSec: Math.round((Date.now() - state.enteredMs) / 1000),
              ua: navigator.userAgent,
              trajectory: state.trajectory
            }, null, 2));
          }));
        }
      } else {
        botTitle.classList.add('hidden');
      }

      // Stage 1: 六大部門
      if (state.view.stage === 'depts') {
        const depts = [
          { id: 'Gestation', title: t.deptGest, sub: t.deptGestSub, cls: 't-gest' },
          { id: 'Farrowing', title: t.deptFarr, sub: t.deptFarrSub, cls: 't-farr' },
          { id: 'Nursery', title: t.deptNurs, sub: t.deptNursSub, cls: 't-nurs' },
          { id: 'Porker', title: t.deptPork, sub: t.deptPorkSub, cls: 't-pork' },
          { id: 'Boar House', title: t.deptBoar, sub: t.deptBoarSub, cls: 't-boar' },
          { id: 'GDU', title: t.deptGdu, sub: t.deptGduSub, cls: 't-gdu' }
        ];
        depts.forEach(d => {
          topGrid.appendChild(createTile(d.title, d.sub, state.profile.group, d.cls, () => {
            pushNavHistory();
            state.view.dept = d.id;
            state.view.wing = '';
            state.view.room = '';
            logTraj('dept:' + d.id);
            if (state.profile.group === 'PS' && ['Gestation', 'Farrowing', 'Nursery', 'Porker'].includes(d.id)) {
              state.view.stage = 'wing';
            } else if (d.id === 'GDU') {
              state.view.stage = 'room';
            } else {
              state.view.room = d.id;
              enterBatchOrRoomTiles();
              return;
            }
            renderView();
          }));
        });
        triggerTileFlips();
        return;
      }

      // Stage 2: A Side / B Side
      if (state.view.stage === 'wing') {
        const cls = getDeptClass(state.view.dept);
        [{ code: 'A', label: t.sideA }, { code: 'B', label: t.sideB }].forEach(w => {
          topGrid.appendChild(createTile(w.label, state.view.dept, w.code, cls, () => {
            pushNavHistory();
            state.view.wing = w.code;
            logTraj('wing:' + w.code);
            if (['Farrowing', 'Nursery', 'Porker'].includes(state.view.dept)) {
              state.view.stage = 'room';
            } else {
              state.view.room = 'Gestation ' + w.code;
              enterBatchOrRoomTiles();
              return;
            }
            renderView();
          }));
        });
        triggerTileFlips();
        return;
      }

      // Stage 3: 房號點選
      if (state.view.stage === 'room') {
        const cls = getDeptClass(state.view.dept);
        let rooms = [];
        if (state.view.dept === 'GDU') {
          rooms = state.profile.group === 'GP'
            ? ['GDU', 'GDU 1', 'GDU 2', 'GDU 3', 'GDU 4', 'GDU 5', 'GDU 6', 'GDU 7', 'GDU 8']
            : ['GDU 1', 'GDU 2', 'GDU 3', 'GDU 4', 'GDU 5', 'GDU 6', 'GDU 7', 'GDU 8'];
        } else if (state.view.dept === 'Farrowing') {
          rooms = ['F1', 'F2', 'F3', 'F4', 'F5', 'F6'];
        } else if (state.view.dept === 'Nursery') {
          rooms = ['N1', 'N2', 'N3', 'N4', 'N5', 'N6', 'N7'];
        } else if (state.view.dept === 'Porker') {
          for (let i = 1; i <= 8; i++) rooms.push(i + 'A', i + 'B');
        }
        rooms.forEach(r => {
          topGrid.appendChild(createTile(r, state.view.dept, r, cls, () => {
            pushNavHistory();
            state.view.room = r;
            logTraj('room:' + r);
            enterBatchOrRoomTiles();
          }));
        });
        triggerTileFlips();
        return;
      }

      // Stage 4: 三週次批次閘門（進入房號後先鎖定三週次批次，切換房號必提醒）
      if (state.view.stage === 'batch_gate') {
        renderBatchGatePanel(formPanel);
        return;
      }

      // Stage 5: 房號內層層作業方塊
      if (state.view.stage === 'room_tiles') {
        renderRoomActionTiles(topGrid);
        triggerTileFlips();
        return;
      }

      // Stage 6: 具體輸入表單
      if (state.view.stage === 'form') {
        renderSpecificForm(formPanel);
      }
    }

    function enterBatchOrRoomTiles() {
      const savedB = loadSavedRoomBatch();
      if (savedB && savedB.w1) {
        state.currentBatch = savedB;
      } else {
        state.currentBatch = { w1: '', w2: '', w3: '' };
      }
      // 每次進入/切換房號先進入批次確認閘門提醒核對房號與三週次批次
      state.view.stage = 'batch_gate';
      renderView();
    }

    function renderBatchGatePanel(panel) {
      const t = DICT[state.lang];
      panel.classList.remove('hidden');
      const curW = getIsoWeekNum(new Date());
      const def1 = state.currentBatch.w1 || curW;
      const def2 = state.currentBatch.w2 || wrap52(Number(def1) + 16);
      const def3 = state.currentBatch.w3 || wrap52(Number(def1) + 19);

      panel.innerHTML = `
        <div class="section-title">${t.batchGateTitle}</div>
        <div style="font-size:14px; font-weight:700; color:#0369a1; margin-bottom:8px;">
          ${[state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' › ')} — ${t.batchRemind}
        </div>
        <div class="batch-trio-grid">
          <div class="batch-cell">
            <label>${t.w1Label}</label>
            <div class="batch-stepper">
              <button type="button" class="step-mini-btn" onclick="stepBatch(1,-1)">-</button>
              <input type="number" id="bw1" class="batch-num-input" min="1" max="52" value="${def1}" onchange="autoCalcW2W3()" />
              <button type="button" class="step-mini-btn" onclick="stepBatch(1,1)">+</button>
            </div>
          </div>
          <div class="batch-cell">
            <label>${t.w2Label}</label>
            <div class="batch-stepper">
              <button type="button" class="step-mini-btn" onclick="stepBatch(2,-1)">-</button>
              <input type="number" id="bw2" class="batch-num-input" min="1" max="52" value="${def2}" />
              <button type="button" class="step-mini-btn" onclick="stepBatch(2,1)">+</button>
            </div>
          </div>
          <div class="batch-cell">
            <label>${t.w3Label}</label>
            <div class="batch-stepper">
              <button type="button" class="step-mini-btn" onclick="stepBatch(3,-1)">-</button>
              <input type="number" id="bw3" class="batch-num-input" min="1" max="52" value="${def3}" />
              <button type="button" class="step-mini-btn" onclick="stepBatch(3,1)">+</button>
            </div>
          </div>
        </div>
        <button type="button" class="primary-btn" onclick="confirmBatchGate()">${t.confirmBatchBtn}</button>
      `;
    }

    function wrap52(n) {
      let x = ((n - 1) % 52 + 52) % 52 + 1;
      return x;
    }

    function getIsoWeekNum(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.min(52, Math.ceil((((date - yearStart) / 86400000) + 1) / 7));
    }

    function stepBatch(idx, delta) {
      const el = document.getElementById('bw' + idx);
      const next = wrap52((parseInt(el.value, 10) || 1) + delta);
      el.value = next;
      if (idx === 1) autoCalcW2W3();
    }

    function autoCalcW2W3() {
      const w1 = parseInt(document.getElementById('bw1').value, 10) || 1;
      document.getElementById('bw2').value = wrap52(w1 + 16);
      document.getElementById('bw3').value = wrap52(w1 + 19);
    }

    function confirmBatchGate() {
      const w1 = document.getElementById('bw1').value.trim();
      const w2 = document.getElementById('bw2').value.trim();
      const w3 = document.getElementById('bw3').value.trim();
      state.currentBatch = { w1, w2, w3 };
      saveRoomBatch(state.currentBatch);
      pushNavHistory();
      state.view.stage = 'room_tiles';
      logTraj('batch:' + [w1, w2, w3].join('/'));
      renderView();
    }

        state.view.formType = 'mortality';

    function getDeptClass(d) {
      return {
        'Gestation': 't-gest',
        'Farrowing': 't-farr',
        'Nursery': 't-nurs',
        'Porker': 't-pork',
        'Boar House': 't-boar',
        'GDU': 't-gdu'
      }[d] || 't-ps';
    }

    function createTile(title, sub, badge, cls, fn) {
      const div = document.createElement('div');
      div.className = 'live-tile ' + cls;
      div.innerHTML = `
        <div>
          <div class="tile-title">${title}</div>
          <div class="tile-sub">${sub}</div>
        </div>
        <div class="tile-badge">${badge}</div>
      `;
      div.addEventListener('click', fn);
      return div;
    }

    function triggerTileFlips() {
      const list = document.querySelectorAll('#topGrid .live-tile');
      list.forEach((el, i) => {
        setTimeout(() => {
          setInterval(() => {
            el.classList.add('flipping');
            setTimeout(() => el.classList.remove('flipping'), 740);
          }, 4000 + i * 420);
        }, i * 280);
      });
    }

    function showExtraNotice(msg) {
      const p = document.getElementById('extraPanel');
      p.classList.remove('hidden');
      p.innerHTML = `<div class="notice-box">${msg}</div>`;
    }

    function buildChips(groupKey, options, multi) {
      state.chips[groupKey] = multi ? [] : '';
      let html = '<div class="chip-row">';
      options.forEach(o => {
        const v = typeof o === 'object' ? o.v : o;
        const l = typeof o === 'object' ? o.l : o;
        html += `<button type="button" class="chip-btn" data-g="${groupKey}" data-v="${v}" data-m="${multi ? '1' : '0'}" onclick="handleChip(this)">${l}</button>`;
      });
      html += '</div>';
      return html;
    }

    function handleChip(btn) {
      const g = btn.dataset.g;
      const v = btn.dataset.v;
      const m = btn.dataset.m === '1';
      if (m) {
        btn.classList.toggle('selected');
        const arr = state.chips[g] || [];
        const idx = arr.indexOf(v);
        if (idx >= 0) arr.splice(idx, 1);
        else arr.push(v);
        state.chips[g] = arr;
      } else {
        document.querySelectorAll(`.chip-btn[data-g="${g}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.chips[g] = v;
      }
    }

          <div class="field-block"><label class="field-label">${t.lblFrontLeg}</label>${buildChips('front_leg_score', ['1','2','3','4','5'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblRearLeg}</label>${buildChips('rear_leg_score', ['1','2','3','4','5'], false)}</div>

          <div class="field-block"><label class="field-label">${t.lblShoulderW}</label><input type="number" step="0.5" id="f_shoulder_width_cm" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblChestW}</label><input type="number" step="0.5" id="f_chest_width_cm" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblVulva}</label>${buildChips('vulva_status', [{v:'Normal',l:t.optNormal},{v:'Small',l:t.optSmall},{v:'Upturned',l:t.optUpturned},{v:'NA',l:t.optNA}], false)}</div>

      panel.innerHTML = html;

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const maxDim = CONFIG.MAX_IMG_PX;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mimeType: 'image/jpeg', base64: c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY) });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function submitCurrentForm() {
      const t = DICT[state.lang];
      const btn = document.getElementById('btnSendForm');
      const box = document.getElementById('submitMsgBox');
      btn.disabled = true;
      box.classList.remove('hidden');
      box.textContent = '...';

      const data = {};
      document.querySelectorAll('#formPanel [id^="f_"]').forEach(el => {
        if (el.type === 'file') return;
        data[el.id.replace(/^f_/, '')] = el.value;
      });
      Object.keys(state.chips).forEach(k => { data[k] = state.chips[k]; });

      const ft = state.view.formType;
      let backendModule = 'daily_fw';
      if (ft === 'daily_fw') backendModule = 'daily_fw';
      else if (ft === 'conformation') backendModule = 'conformation';
      else if (ft === 'gestation') {
        backendModule = 'gestation';
        // 表面只選日期，送回後端自動附帶精確時間戳記
        const nowTime = new Date().toTimeString().slice(0, 8);
        if (data.breeding_date) data.breeding_datetime_hidden = `${data.breeding_date} ${nowTime}`;
      } else if (ft.startsWith('farr_')) {
        backendModule = 'farrowing';
        data.sub_action = ft;
      } else if (ft === 'boar_semen') backendModule = 'boar_semen';
      else if (ft === 'malformation') backendModule = 'malformation_disease';
      else if (ft === 'treatment' || ft === 'mortality') {
        backendModule = 'treatment_mortality';
        data.event_type = ft;
      }

      let photo = null;
      const photoInput = document.getElementById('f_photo_file');
      if (photoInput && photoInput.files && photoInput.files[0]) {
        photo = await compressPhoto(photoInput.files[0]);
      }

      logTraj('submit:' + backendModule);

      const payload = {
        token: CONFIG.API_TOKEN,
        module: backendModule,
        common: {
          farm_mode: state.profile.group,
          wing: state.view.wing,
          room: state.view.room,
          location: [state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' / '),
          batch: state.currentBatch,
          module: backendModule
        },
        data: data,
        photo: photo,
        meta: {
          entered_at: state.enteredAt,
          submitted_at: new Date().toISOString(),
          dwell_seconds: Math.max(1, Math.round((Date.now() - state.enteredMs) / 1000)),
          ui_lang: state.lang,
          role_level: state.profile.level,
          device_summary: /mobile|android|iphone|ipad/i.test(navigator.userAgent) ? 'Mobile/Tablet' : 'Desktop',
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height + '@' + (window.devicePixelRatio || 1),
          trajectory_summary: state.trajectory.join(' -> '),
          offline_queued: false
        }
      };

      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const j = await res.json();
        if (j && j.ok) {
          box.textContent = t.savedOk + (j.rowId || 'OK');
        } else {
          throw new Error(j && j.error ? j.error : 'ERR');
        }
      } catch (e) {
        payload.meta.offline_queued = true;
        const q = getQueue();
        q.push(payload);
        localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(q));
        refreshQueuePill();
        box.textContent = t.savedOffline;
      }
      btn.disabled = false;
    }

    function getQueue() {
      try { return JSON.parse(localStorage.getItem(CONFIG.KEYS.QUEUE) || '[]'); }
      catch (e) { return []; }
    }

    function refreshQueuePill() {
      const q = getQueue();
      const el = document.getElementById('queuePill');
      if (q.length > 0) {
        el.textContent = q.length;
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    async function syncOfflineQueue() {
      const q = getQueue();
      if (!q.length) return;
      const keep = [];
      for (const item of q) {
        try {
          const res = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(item)
          });
          const j = await res.json();
          if (!j || !j.ok) keep.push(item);
        } catch (e) {
          keep.push(item);
        }
      }
      localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(keep));
      refreshQueuePill();
    }

    window.addEventListener('online', syncOfflineQueue);

    (function init() {
      state.lang = detectSystemLang();
      document.documentElement.lang = state.lang;
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
      applyStaticTranslations();
      updateClockAndCurve();
      setInterval(updateClockAndCurve, 1000);
      loadHourlyWeather();
      refreshQueuePill();
      logTraj('init');

      const savedPass = localStorage.getItem(CONFIG.KEYS.PASS);
      if (savedPass) {
        const prof = resolvePass(savedPass);
        if (prof) {
          state.profile = prof;
          openWorkspace();
        }
      }
    })();
    // === [END MODULE 4] ===
  </script>
