<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e8eef6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GLA Field Hub</title>
  <style>
    /* === [START MODULE 3: MOBILE COMPACT TILES, BIG TRIANGLES & SPLIT CARDS] === */
    :root {
      --text-primary: #0f172a;
      --text-secondary: #475569;

      --tile-gp: #ede7f6;
      --tile-gp-b: #b39ddb;
      --tile-ps: #e8f5e9;
      --tile-ps-b: #81c784;
      --tile-gest: #e0f2f1;
      --tile-gest-b: #80cbc4;
      --tile-farr: #ffebee;
      --tile-farr-b: #ef9a9a;
      --tile-nurs: #fffde7;
      --tile-nurs-b: #fff176;
      --tile-pork: #eceff1;
      --tile-pork-b: #b0bec5;
      --tile-boar: #cfd8dc;
      --tile-boar-b: #90a4ae;
      --tile-gdu: #f3e5f5;
      --tile-gdu-b: #ce93d8;
      --tile-maint: #fff3e0;
      --tile-maint-b: #ffcc80;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      padding: 8px 22px 68px 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #e8eef6 0%, #f7f9fc 100%);
      color: var(--text-primary);
      font-size: 15px;
      min-height: 100vh;
    }

    /* 左右側邊細長條 + 放大約 2.5 倍三角形 */
    .edge-rail {
      position: fixed;
      top: 0;
      bottom: 56px;
      width: 20px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.04);
      cursor: pointer;
    }
    .edge-rail:active { background: rgba(2, 132, 199, 0.18); }
    .edge-rail.left { left: 0; }
    .edge-rail.right { right: 0; }

    .tri-big {
      width: 0;
      height: 0;
      opacity: 0.36;
    }
    .edge-rail:active .tri-big { opacity: 0.85; }
    .tri-left {
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-right: 15px solid #1e293b;
    }
    .tri-right {
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 15px solid #1e293b;
    }

    /* 頂部列：BM -> EN -> 中 + 重新更新 / 切換密碼 */
    .top-bar {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 8px auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pill-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    /* 拆分成多個獨立小框：時間框、地點框、現有溫度與雨情框、未來溫度預報曲線框 */
    .split-widget-wrap {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 10px auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .mini-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .sub-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 9px 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .clock-val {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
    }

    .date-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .loc-val {
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.25;
    }

    .temp-val {
      font-size: 18px;
      font-weight: 800;
      color: #0369a1;
    }

    .rain-txt {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-top: 2px;
    }

    .curve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 3px;
    }

    .span-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 密碼框（零暗示，Enter 直接進入） */
    .auth-card {
      width: 100%;
      max-width: 400px;
      margin: 18px auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #1e293b;
    }

    .input-box {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
    }

    .primary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      background: #0284c7;
      color: #ffffff;
      cursor: pointer;
    }

    /* 主工作區直立窄寬適配 */
    .main-wrap {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .context-bar {
      background: #ffffff;
      border: 1px solid #bae6fd;
      border-radius: 14px;
      padding: 8px 11px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .batch-chip {
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 三週次批次三個小框 */
    .batch-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .batch-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
    }

    .batch-box label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }

    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .step-btn {
      width: 24px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 0;
      cursor: pointer;
    }

    .batch-inp {
      width: 42px;
      height: 30px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      background: #fff;
      padding: 0;
    }

    /* 縮小且防溢位的柔和圓弧動態磚 */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @keyframes softFlip {
      0% { transform: perspective(600px) rotateX(0deg); }
      45% { transform: perspective(600px) rotateX(12deg); }
      100% { transform: perspective(600px) rotateX(0deg); }
    }

    .live-tile {
      border-radius: 18px;
      padding: 11px 11px;
      min-height: 82px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid transparent;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: transform 0.12s ease;
      user-select: none;
    }

    .live-tile:active { transform: scale(0.96); }
    .live-tile.flipping { animation: softFlip 0.65s ease; }

    .tile-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      color: #0f172a;
      word-break: break-word;
    }

    .tile-sub {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-top: 4px;
      line-height: 1.25;
    }

    .tile-badge {
      align-self: flex-end;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #1e293b;
      margin-top: 6px;
    }

    .t-gp { background: var(--tile-gp); border-color: var(--tile-gp-b); }
    .t-ps { background: var(--tile-ps); border-color: var(--tile-ps-b); }
    .t-gest { background: var(--tile-gest); border-color: var(--tile-gest-b); }
    .t-farr { background: var(--tile-farr); border-color: var(--tile-farr-b); }
    .t-nurs { background: var(--tile-nurs); border-color: var(--tile-nurs-b); }
    .t-pork { background: var(--tile-pork); border-color: var(--tile-pork-b); }
    .t-boar { background: var(--tile-boar); border-color: var(--tile-boar-b); }
    .t-gdu { background: var(--tile-gdu); border-color: var(--tile-gdu-b); }
    .t-maint { background: var(--tile-maint); border-color: var(--tile-maint-b); }

    .section-gap { height: 18px; }
    .sec-title {
      font-size: 15px;
      font-weight: 800;
      margin: 4px 0 7px 2px;
      color: #1e293b;
    }

    .panel-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
    }

    .field-block { margin-bottom: 11px; }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }

    .chip-btn.selected {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .stage-tracker {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      font-weight: 800;
    }
    .stage-tracker.st-prep { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; }
    .stage-tracker.st-sending { background: #fef9c3; border-color: #facc15; color: #854d0e; }
    .stage-tracker.st-done { background: #dcfce7; border-color: #4ade80; color: #166534; }
    .stage-tracker.st-queued { background: #ffedd5; border-color: #fb923c; color: #9a3412; }
    .stage-tracker.st-err { background: #fee2e2; border-color: #f87171; color: #991b1b; }

    .notice-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      white-space: pre-wrap;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      padding: 0 18px;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .hidden { display: none !important; }
    /* === [END MODULE 3] === */
  </style>
</head>
<body>
  <div class="edge-rail left" onclick="goPrev()">
    <div class="tri-big tri-left"></div>
  </div>
  <div class="edge-rail right" onclick="goNext()">
    <div class="tri-big tri-right"></div>
  </div>

  <!-- 頂部：BM -> EN -> 中 + 重新更新 / 切換密碼（移除清除記憶與 basic 字樣） -->
  <div class="top-bar">
    <div class="pill-group">
      <button type="button" class="pill-btn" data-lang="ms" onclick="setLang('ms')">BM</button>
      <button type="button" class="pill-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="pill-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">中</button>
    </div>
    <div class="pill-group">
      <button type="button" class="pill-btn active" id="btnSoundToggle" onclick="toggleSound()"></button>
      <button type="button" class="pill-btn" id="btnRefresh" onclick="refreshAllNow()"></button>
      <span id="queuePill" class="pill-btn hidden" style="background:#f59e0b; color:#fff; border-color:#f59e0b;" onclick="syncOfflineQueue()">0</span>
      <button type="button" class="pill-btn" id="btnSwitchCode" onclick="promptSwitchCode()"></button>
    </div>
  </div>

  <!-- 拆分成獨立小框：時間框、地點框、現有溫度與雨情框、未來溫度預報曲線框 -->
  <section class="split-widget-wrap">
    <div class="mini-row-2">
      <div class="sub-box">
        <div class="clock-val" id="clockNow">--:--:--</div>
        <div class="date-sub" id="dateSub">--</div>
      </div>
      <div class="sub-box">
        <div class="loc-val" id="locSub">--</div>
        <div class="date-sub" id="groupStatusSub">-</div>
      </div>
    </div>

    <div class="mini-row-2">
      <div class="sub-box">
        <div class="temp-val" id="tempNowVal">--°C</div>
        <div class="rain-txt" id="rainNowTxt">--</div>
      </div>
      <div class="sub-box">
        <div class="curve-header">
          <span id="curveTitle"></span>
          <button type="button" class="span-btn" id="btnSpanToggle" onclick="toggleSpan()">±3H / ±6H</button>
        </div>
        <svg id="forecastCurveSvg" viewBox="0 0 240 52" width="100%" height="52"></svg>
      </div>
    </div>
  </section>

  <!-- 密碼輸入框（零暗示，Enter 直接進入） -->
  <section id="loginCard" class="auth-card">
    <label class="field-label" id="lblPass" for="inpPass"></label>
    <input type="password" id="inpPass" class="input-box" autocomplete="off" onkeydown="if(event.key==='Enter') submitLogin();" />
    <button type="button" class="primary-btn" id="btnLogin" onclick="submitLogin()"></button>
    <div id="errLogin" class="notice-box hidden" style="background:#fee2e2; color:#991b1b;"></div>
  </section>

  <!-- 主工作區 -->
  <main id="workspaceMain" class="main-wrap hidden">
    <div class="context-bar">
      <span id="locBannerText">-</span>
      <span id="batchBannerBtn" class="batch-chip hidden" onclick="reopenBatchGate()"></span>
    </div>

    <div id="topGrid" class="tile-grid"></div>
    <div class="section-gap"></div>
    <div id="bottomTitle" class="sec-title hidden"></div>
    <div id="bottomGrid" class="tile-grid"></div>

    <div id="formPanel" class="panel-card hidden"></div>
    <div id="extraPanel" class="panel-card hidden"></div>
  </main>

  <!-- 底部上一頁／下一頁 -->
  <nav class="bottom-nav">
    <button type="button" class="nav-btn" id="btnNavPrev" onclick="goPrev()"></button>
    <button type="button" class="nav-btn" id="btnNavNext" onclick="goNext()"></button>
  </nav>

      halfSpan: 6, // 3 => ±3H, 6 => ±6H (現在在正中央)
      hourly24: Array.from({ length: 24 }, (_, h) => Math.round(25 + 6 * Math.sin(((h - 6) / 24) * Math.PI * 2))),
      rainProbMax: 40,
      view: {
        stage: 'depts',

    function playAlertTone(kind) {
      if (!state.soundOn) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (kind === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.11);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.29);
        } else if (kind === 'queued') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(392.0, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.24);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220.0, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        }
      } catch (e) {}
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      localStorage.setItem(CONFIG.KEYS.SOUND, state.soundOn ? '1' : '0');
      applyTexts();
      if (state.soundOn) playAlertTone('success');
    }

    function detectSystemLang() {
      const saved = localStorage.getItem(CONFIG.KEYS.LANG);
      if (saved && DICT[saved]) return saved;
      const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'ms'];
      for (const item of list) {
        const low = String(item).toLowerCase();
        if (low.startsWith('ms') || low.includes('may') || low.includes('my')) return 'ms';
        if (low.startsWith('en')) return 'en';
        if (low.startsWith('zh')) return 'zh-TW';
      }
      return 'ms';
    }

    function setLang(code) {
      if (!DICT[code]) return;
      state.lang = code;
      document.documentElement.lang = code;
      localStorage.setItem(CONFIG.KEYS.LANG, code);
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === code));
      logTraj('lang:' + code);
      applyTexts();
      updateClockAndForecastCurve();
      if (state.profile) renderView();
    }

    function applyTexts() {
      const t = DICT[state.lang];
      document.getElementById('lblPass').textContent = t.passLabel;
      document.getElementById('btnLogin').textContent = t.enterBtn;
      document.getElementById('btnSwitchCode').textContent = t.switchCode;
      document.getElementById('btnRefresh').textContent = t.refreshBtn;
      document.getElementById('btnSoundToggle').textContent = state.soundOn ? t.soundOn : t.soundOff;
      document.getElementById('btnSoundToggle').classList.toggle('active', state.soundOn);
      document.getElementById('btnNavPrev').textContent = '◀ ' + t.prevBtn;
      document.getElementById('btnNavNext').textContent = t.nextBtn + ' ▶';
      document.getElementById('bottomTitle').textContent = t.extraHeading;
      document.getElementById('curveTitle').textContent = state.halfSpan === 3 ? t.curveAroundNow3 : t.curveAroundNow6;
    }

    function toggleSpan() {
      state.halfSpan = state.halfSpan === 6 ? 3 : 6;
      applyTexts();
      updateClockAndForecastCurve();
    }

    function refreshAllNow() {
      logTraj('refresh');
      loadForecastWeather();
      syncOfflineQueue();
      if (state.profile) renderView();
      playAlertTone('success');
    }

    function logTraj(tag) {
      const sec = Math.round((Date.now() - state.enteredMs) / 1000);
      state.trajectory.push(sec + 's:' + tag);
      if (state.trajectory.length > 50) state.trajectory.shift();
    }

    function parsePass(raw) {
      const p = String(raw || '').trim().toLowerCase();
      if (p === CONFIG.PASSWORDS.ps_basic) return { group: 'PS', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.ps_query) return { group: 'PS', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.ps_report) return { group: 'PS', level: 'report', code: p };
      if (p === CONFIG.PASSWORDS.gp_basic) return { group: 'GP', level: 'basic', code: p };
      if (p === CONFIG.PASSWORDS.gp_query) return { group: 'GP', level: 'query', code: p };
      if (p === CONFIG.PASSWORDS.admin) return { group: 'PS', level: 'admin', code: p };
      return null;
    }

    function submitLogin() {
      const prof = parsePass(document.getElementById('inpPass').value);
      const err = document.getElementById('errLogin');
      if (!prof) {
        err.textContent = DICT[state.lang].badPass;
        err.classList.remove('hidden');
        playAlertTone('error');
        return;
      }
      err.classList.add('hidden');
      state.profile = prof;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      logTraj('login:' + prof.group);
      openWorkspace();
    }

    function promptSwitchCode() {
      const p = prompt(DICT[state.lang].passLabel);
      if (p === null) return;
      const prof = parsePass(p);
      if (!prof) {
        alert(DICT[state.lang].badPass);
        playAlertTone('error');
        return;
      }
      state.profile = prof;
      localStorage.setItem(CONFIG.KEYS.PASS, prof.code);
      state.view = { stage: 'depts', dept: '', wing: '', room: '', formType: '' };
      state.history = [];
      state.redoStack = [];
      logTraj('switch:' + prof.group);
      openWorkspace();
    }

    function openWorkspace() {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('workspaceMain').classList.remove('hidden');
      document.getElementById('locSub').textContent = DICT[state.lang].locationName;
      document.getElementById('groupStatusSub').textContent = state.profile.group;
      renderView();
    }

    // 時鐘、日期與「現在在正中央」之未來溫度預報曲線
    function updateClockAndForecastCurve() {
      const t = DICT[state.lang];
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const curH = now.getHours();
      const curM = now.getMinutes();

      document.getElementById('clockNow').textContent = `${pad(curH)}:${pad(curM)}:${pad(now.getSeconds())}`;
      document.getElementById('dateSub').textContent = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
      document.getElementById('locSub').textContent = t.locationName;
      if (state.profile) document.getElementById('groupStatusSub').textContent = state.profile.group;

      const curTemp = state.hourly24[curH] !== undefined ? state.hourly24[curH] : 29;
      document.getElementById('tempNowVal').textContent = curTemp + '°C';
      document.getElementById('rainNowTxt').textContent =
        (state.rainProbMax >= 50 ? t.rainLikely : t.rainLow) + ` (${state.rainProbMax}%)`;

      const k = state.halfSpan; // 現在在正中央 idx = k，總共 2k + 1 點
      const points = [];
      for (let offset = -k; offset <= k; offset++) {
        const hIdx = Math.max(0, Math.min(23, curH + offset));
        points.push({
          offset,
          hour: hIdx,
          temp: state.hourly24[hIdx] ?? curTemp
        });
      }

      const temps = points.map(p => p.temp);
      const minT = Math.min(...temps) - 1;
      const maxT = Math.max(...temps) + 1;

      const coords = points.map((pt, idx) => {
        const x = 14 + (idx / Math.max(1, points.length - 1)) * 212;
        const y = 38 - ((pt.temp - minT) / Math.max(1, maxT - minT)) * 24;
        return { x, y, hour: pt.hour, temp: pt.temp, isNow: pt.offset === 0 };
      });

      const centerPt = coords[Math.floor(coords.length / 2)];
      const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
      const areaPath = linePath + ` L${coords[coords.length - 1].x.toFixed(1)},43 L${coords[0].x.toFixed(1)},43 Z`;

      const svg = document.getElementById('forecastCurveSvg');
      svg.innerHTML = `
        <defs>
          <linearGradient id="fcGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#fcGrad)"></path>
        <path d="${linePath}" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"></path>
        ${coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.2" fill="#0369a1"></circle>`).join('')}
        <!-- 現在時間點在正中央 -->
        <line x1="${centerPt.x.toFixed(1)}" y1="4" x2="${centerPt.x.toFixed(1)}" y2="45" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="2.5,2"></line>
        <circle cx="${centerPt.x.toFixed(1)}" cy="${centerPt.y.toFixed(1)}" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.4"></circle>

        <text x="12" y="51" font-size="8" fill="#64748b">${pad(coords[0].hour)}:00</text>
        <text x="${centerPt.x.toFixed(1)}" y="51" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">${pad(curH)}:00</text>
        <text x="228" y="51" text-anchor="end" font-size="8" fill="#0369a1">${pad(coords[coords.length - 1].hour)}:00</text>
      `;
    }

    async function loadForecastWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FKuching&forecast_days=1`;
        const res = await fetch(url);
        const j = await res.json();
        if (j && j.hourly && Array.isArray(j.hourly.temperature_2m)) {
          state.hourly24 = j.hourly.temperature_2m.slice(0, 24).map(v => Math.round(v));
          const probs = j.hourly.precipitation_probability || [];
          state.rainProbMax = probs.length ? Math.max(...probs.slice(0, 24)) : 0;
          updateClockAndForecastCurve();
        }
      } catch (e) {}
    }

    function pushHist() {
      state.history.push(JSON.parse(JSON.stringify(state.view)));
      state.redoStack = [];
    }

    function goPrev() {
      if (!state.history.length) return;
      state.redoStack.push(JSON.parse(JSON.stringify(state.view)));
      state.view = state.history.pop();
      logTraj('prev');
      renderView();
    }

    function goNext() {
      if (!state.redoStack.length) return;
      state.history.push(JSON.parse(JSON.stringify(state.view)));
      state.view = state.redoStack.pop();
      logTraj('next');
      renderView();
    }

    function getRoomKey() {
      return [state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean).join('_');
    }

    function loadSavedBatch() {
      try {
        const map = JSON.parse(localStorage.getItem(CONFIG.KEYS.ROOM_BATCHES) || '{}');
        return map[getRoomKey()] || null;
      } catch (e) { return null; }
    }

    function saveBatch(obj) {
      try {
        const map = JSON.parse(localStorage.getItem(CONFIG.KEYS.ROOM_BATCHES) || '{}');
        map[getRoomKey()] = obj;
        localStorage.setItem(CONFIG.KEYS.ROOM_BATCHES, JSON.stringify(map));
      } catch (e) {}
    }

    function reopenBatchGate() {
      if (!state.view.dept) return;
      pushHist();
      state.view.stage = 'batch_gate';
      renderView();
    }

    function renderView() {
      const t = DICT[state.lang];
      const topGrid = document.getElementById('topGrid');
      const botGrid = document.getElementById('bottomGrid');
      const botTitle = document.getElementById('bottomTitle');
      const formPanel = document.getElementById('formPanel');
      const extraPanel = document.getElementById('extraPanel');

      topGrid.innerHTML = '';
      botGrid.innerHTML = '';
      formPanel.classList.add('hidden');
      extraPanel.classList.add('hidden');

      const parts = [state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean);
      document.getElementById('locBannerText').textContent = parts.join(' › ');

      const batchChip = document.getElementById('batchBannerBtn');
      if (state.view.room || ['batch_gate', 'room_tiles', 'form'].includes(state.view.stage)) {
        const bStr = [state.currentBatch.w1, state.currentBatch.w2, state.currentBatch.w3].filter(Boolean).join('/');
        batchChip.textContent = (bStr ? `${bStr} · ` : '') + t.tapToChangeBatch;
        batchChip.classList.remove('hidden');
      } else {
        batchChip.classList.add('hidden');
      }

      if (['query', 'report', 'admin'].includes(state.profile.level)) {
        botTitle.classList.remove('hidden');
        botGrid.appendChild(makeTile(t.deptFarr, t.extraHeading, 'A1', 't-farr', () => {
          showExtra('Farrowing Analytics');
        }));
        botGrid.appendChild(makeTile(t.extraHeading, state.profile.group, 'Q1', 't-gp', () => {
          showExtra('Query Hub');
        }));
        if (state.profile.level === 'admin') {
          botGrid.appendChild(makeTile('QWERT', state.trajectory.slice(-3).join(' | '), 'LOG', 't-boar', () => {
            showExtra(JSON.stringify({
              dwellSec: Math.round((Date.now() - state.enteredMs) / 1000),
              ua: navigator.userAgent,
              trajectory: state.trajectory
            }, null, 2));
          }));
        }
      } else {
        botTitle.classList.add('hidden');
      }

      if (state.view.stage === 'depts') {
        const depts = [
          { id: 'Gestation', title: t.deptGest, sub: t.deptGestSub, cls: 't-gest' },
          { id: 'Farrowing', title: t.deptFarr, sub: t.deptFarrSub, cls: 't-farr' },
          { id: 'Nursery', title: t.deptNurs, sub: t.deptNursSub, cls: 't-nurs' },
          { id: 'Porker', title: t.deptPork, sub: t.deptPorkSub, cls: 't-pork' },
          { id: 'Boar House', title: t.deptBoar, sub: t.deptBoarSub, cls: 't-boar' },
          { id: 'GDU', title: t.deptGdu, sub: t.deptGduSub, cls: 't-gdu' }
        ];
        depts.forEach(d => {
          topGrid.appendChild(makeTile(d.title, d.sub, state.profile.group, d.cls, () => {
            pushHist();
            state.view.dept = d.id;
            state.view.wing = '';
            state.view.room = '';
            logTraj('dept:' + d.id);
            if (state.profile.group === 'PS' && ['Gestation', 'Farrowing', 'Nursery', 'Porker'].includes(d.id)) {
              state.view.stage = 'wing';
            } else if (d.id === 'GDU') {
              state.view.stage = 'room';
            } else {
              state.view.room = d.id;
              enterBatchGate();
              return;
            }
            renderView();
          }));
        });
        runTileFlip();
        return;
      }

      if (state.view.stage === 'wing') {
        const cls = deptCls(state.view.dept);
        [{ code: 'A', label: t.sideA }, { code: 'B', label: t.sideB }].forEach(w => {
          topGrid.appendChild(makeTile(w.label, state.view.dept, w.code, cls, () => {
            pushHist();
            state.view.wing = w.code;
            logTraj('wing:' + w.code);
            if (['Farrowing', 'Nursery', 'Porker'].includes(state.view.dept)) {
              state.view.stage = 'room';
            } else {
              state.view.room = 'Gestation ' + w.code;
              enterBatchGate();
              return;
            }
            renderView();
          }));
        });
        runTileFlip();
        return;
      }

      if (state.view.stage === 'room') {
        const cls = deptCls(state.view.dept);
        let rooms = [];
        if (state.view.dept === 'GDU') {
          rooms = state.profile.group === 'GP'
            ? ['GDU', 'GDU 1', 'GDU 2', 'GDU 3', 'GDU 4', 'GDU 5', 'GDU 6', 'GDU 7', 'GDU 8']
            : ['GDU 1', 'GDU 2', 'GDU 3', 'GDU 4', 'GDU 5', 'GDU 6', 'GDU 7', 'GDU 8'];
        } else if (state.view.dept === 'Farrowing') {
          rooms = ['F1', 'F2', 'F3', 'F4', 'F5', 'F6'];
        } else if (state.view.dept === 'Nursery') {
          rooms = ['N1', 'N2', 'N3', 'N4', 'N5', 'N6', 'N7'];
        } else if (state.view.dept === 'Porker') {
          for (let i = 1; i <= 8; i++) rooms.push(i + 'A', i + 'B');
        }
        rooms.forEach(r => {
          topGrid.appendChild(makeTile(r, state.view.dept, r, cls, () => {
            pushHist();
            state.view.room = r;
            logTraj('room:' + r);
            enterBatchGate();
          }));
        });
        runTileFlip();
        return;
      }

      if (state.view.stage === 'batch_gate') {
        renderBatchGate(formPanel);
        return;
      }

      if (state.view.stage === 'room_tiles') {
        renderRoomTiles(topGrid);
        runTileFlip();
        return;
      }

      if (state.view.stage === 'form') {
        renderForm(formPanel);
      }
    }

    function enterBatchGate() {
      const saved = loadSavedBatch();
      state.currentBatch = saved && saved.w1 ? saved : { w1: '', w2: '', w3: '' };
      state.view.stage = 'batch_gate';
      renderView();
    }

    function renderBatchGate(panel) {
      const t = DICT[state.lang];
      panel.classList.remove('hidden');
      const curW = isoWeek(new Date());
      const def1 = state.currentBatch.w1 || curW;
      const def2 = state.currentBatch.w2 || wrap52(Number(def1) + 16);
      const def3 = state.currentBatch.w3 || wrap52(Number(def1) + 19);

      panel.innerHTML = `
        <div class="sec-title">${t.batchGateTitle}</div>
        <div style="font-size:13px; font-weight:700; color:#0369a1; margin-bottom:6px;">
          ${[state.profile.group, state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' › ')} · ${t.batchRemind}
        </div>
        <div class="batch-trio">
          <div class="batch-box">
            <label>${t.w1Label}</label>
            <div class="stepper-row">
              <button type="button" class="step-btn" onclick="stepW(1,-1)">-</button>
              <input type="number" id="bw1" class="batch-inp" min="1" max="52" value="${def1}" onchange="syncW2W3()" />
              <button type="button" class="step-btn" onclick="stepW(1,1)">+</button>
            </div>
          </div>
          <div class="batch-box">
            <label>${t.w2Label}</label>
            <div class="stepper-row">
              <button type="button" class="step-btn" onclick="stepW(2,-1)">-</button>
              <input type="number" id="bw2" class="batch-inp" min="1" max="52" value="${def2}" />
              <button type="button" class="step-btn" onclick="stepW(2,1)">+</button>
            </div>
          </div>
          <div class="batch-box">
            <label>${t.w3Label}</label>
            <div class="stepper-row">
              <button type="button" class="step-btn" onclick="stepW(3,-1)">-</button>
              <input type="number" id="bw3" class="batch-inp" min="1" max="52" value="${def3}" />
              <button type="button" class="step-btn" onclick="stepW(3,1)">+</button>
            </div>
          </div>
        </div>
        <button type="button" class="primary-btn" onclick="confirmBatch()">${t.confirmBatchBtn}</button>
      `;
    }

    function wrap52(n) {
      return ((n - 1) % 52 + 52) % 52 + 1;
    }

    function isoWeek(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.min(52, Math.ceil((((date - yearStart) / 86400000) + 1) / 7));
    }

    function stepW(idx, delta) {
      const el = document.getElementById('bw' + idx);
      el.value = wrap52((parseInt(el.value, 10) || 1) + delta);
      if (idx === 1) syncW2W3();
    }

    function syncW2W3() {
      const w1 = parseInt(document.getElementById('bw1').value, 10) || 1;
      document.getElementById('bw2').value = wrap52(w1 + 16);
      document.getElementById('bw3').value = wrap52(w1 + 19);
    }

    function confirmBatch() {
      const w1 = document.getElementById('bw1').value.trim();
      const w2 = document.getElementById('bw2').value.trim();
      const w3 = document.getElementById('bw3').value.trim();
      state.currentBatch = { w1, w2, w3 };
      saveBatch(state.currentBatch);
      pushHist();
      state.view.stage = 'room_tiles';
      logTraj('batch:' + [w1, w2, w3].join('/'));
      renderView();
    }

        state.view.formType = 'daily_fw';

        renderView();

          pushHist();
          state.view.formType = 'farr_sow_in';
          state.view.stage = 'form';
          renderView();
        }));
        grid.appendChild(makeTile(t.tileFarrRec, t.tileFarrRecSub, 'BORN', cls, () => {
          pushHist();
          state.view.formType = 'farr_birth';
          state.view.stage = 'form';
          renderView();
        }));

          state.view.formType = 'farr_wean_head';
          state.view.stage = 'form';
          renderView();
        }));
        grid.appendChild(makeTile(t.tileWeanWt, t.tileWeanWtSub, 'THU-2', cls, () => {
          pushHist();
          state.view.formType = 'farr_wean_wt';
          state.view.stage = 'form';
          renderView();
        }));
        grid.appendChild(makeTile(t.tileMal, t.tileMalSub, 'MAL', cls, () => {
          pushHist();
          state.view.formType = 'malformation';
          state.view.stage = 'form';
          renderView();
        }));
      } else if (dept === 'Gestation') {
        grid.appendChild(makeTile(t.tileProd, t.tileProdSub, 'AI', cls, () => {
          pushHist();
          state.view.formType = 'gestation';
          state.view.stage = 'form';
          renderView();
        }));
      } else if (dept === 'Boar House') {
        grid.appendChild(makeTile(t.tileProd, t.tileProdSub, 'SEMEN', cls, () => {
          pushHist();
          state.view.formType = 'boar_semen';
          state.view.stage = 'form';
          renderView();
        }));
      } else if (dept === 'GDU') {
        grid.appendChild(makeTile(t.tileProd, t.tileProdSub, 'SELECT', cls, () => {

          state.view.stage = 'form';
          renderView();
        }));
      }

      grid.appendChild(makeTile(t.tileTreat, t.tileTreatSub, 'RX', cls, () => {
        pushHist();
        state.view.formType = 'treatment';
        state.view.stage = 'form';
        renderView();
      }));
      grid.appendChild(makeTile(t.tileMort, t.tileMortSub, 'MORT', cls, () => {
        pushHist();
        state.view.formType = 'mortality';
        state.view.stage = 'form';
        renderView();
      }));
    }

    function deptCls(d) {
      return {
        'Gestation': 't-gest',
        'Farrowing': 't-farr',
        'Nursery': 't-nurs',
        'Porker': 't-pork',
        'Boar House': 't-boar',
        'GDU': 't-gdu'
      }[d] || 't-ps';
    }

    function makeTile(title, sub, badge, cls, onClick) {
      const div = document.createElement('div');
      div.className = 'live-tile ' + cls;
      div.innerHTML = `
        <div>
          <div class="tile-title">${title}</div>
          <div class="tile-sub">${sub}</div>
        </div>
        <div class="tile-badge">${badge}</div>
      `;
      div.addEventListener('click', onClick);
      return div;
    }

    function runTileFlip() {
      const tiles = document.querySelectorAll('#topGrid .live-tile');
      tiles.forEach((el, idx) => {
        setTimeout(() => {
          setInterval(() => {
            el.classList.add('flipping');
            setTimeout(() => el.classList.remove('flipping'), 680);
          }, 4200 + idx * 420);
        }, idx * 260);
      });
    }

    function showExtra(txt) {
      const p = document.getElementById('extraPanel');
      p.classList.remove('hidden');
      p.innerHTML = `<div class="notice-box">${txt}</div>`;
    }

    function chips(key, opts, multi) {
      state.chips[key] = multi ? [] : '';
      let h = '<div class="chip-row">';
      opts.forEach(o => {
        const v = typeof o === 'object' ? o.v : o;
        const l = typeof o === 'object' ? o.l : o;
        h += `<button type="button" class="chip-btn" data-g="${key}" data-v="${v}" data-m="${multi ? '1' : '0'}" onclick="toggleChip(this)">${l}</button>`;
      });
      h += '</div>';
      return h;
    }

    function toggleChip(btn) {
      const g = btn.dataset.g;
      const v = btn.dataset.v;
      const m = btn.dataset.m === '1';
      if (m) {
        btn.classList.toggle('selected');
        const arr = state.chips[g] || [];
        const i = arr.indexOf(v);
        if (i >= 0) arr.splice(i, 1);
        else arr.push(v);
        state.chips[g] = arr;
      } else {
        document.querySelectorAll(`.chip-btn[data-g="${g}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.chips[g] = v;
      }
    }

          <div class="field-block"><label class="field-label">${t.lblHeatObs}</label>${chips('heat_observed', [{v:'yes',l:t.optYes},{v:'no',l:t.optNo}], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblHeatDate}</label><input type="date" id="f_heat_date" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblBreedDate}</label><input type="date" id="f_breeding_date" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblServiceBoar}</label><input type="text" id="f_service_boar_tag" class="input-box" /></div>
        `;
      } else if (ft === 'boar_semen') {
        html += `
          <div class="field-block"><label class="field-label">${t.lblBoarTag}</label><input type="text" id="f_boar_ear_tag" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblDate}</label><input type="date" id="f_collection_date" class="input-box" value="${today}" /></div>
          <div class="field-block"><label class="field-label">${t.lblLibido}</label>${chips('libido_score', ['1','2','3','4','5'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblVol}</label><input type="number" step="1" id="f_volume_ml" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblConc}</label><input type="number" step="0.01" id="f_concentration_100m_ml" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblMot}</label><input type="number" step="1" id="f_motility_pct" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblProg}</label><input type="number" step="1" id="f_progressive_pct" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblAbn}</label><input type="number" step="1" id="f_abnormality_pct" class="input-box" /></div>
        `;
      } else if (ft === 'conformation') {
        html += `
          <div class="field-block"><label class="field-label">${t.lblEarTag}</label><input type="text" id="f_ear_tag" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblSex}</label>${chips('sex', [{v:'female',l:t.optFemale},{v:'male',l:t.optMale}], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblBreed}</label>${chips('breed', ['L','Y','D','LL','YY','DD','LY'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblBirthDate}</label><input type="date" id="f_birth_date" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblTestDate}</label><input type="date" id="f_test_date" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblTestWt}</label><input type="number" step="0.1" id="f_test_weight_kg" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblLeftTeat}</label>${chips('left_teats', ['6','7','8','9','10'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblRightTeat}</label>${chips('right_teats', ['6','7','8','9','10'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblBlindTeat}</label>${chips('blind_teats', ['0','1','2','3','4'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblFrontLeg}</label>${chips('front_leg_score', ['1','2','3','4','5'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblRearLeg}</label>${chips('rear_leg_score', ['1','2','3','4','5'], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblBodyLen}</label><input type="number" step="0.5" id="f_body_length_cm" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblShoulderW}</label><input type="number" step="0.5" id="f_shoulder_width_cm" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblChestW}</label><input type="number" step="0.5" id="f_chest_width_cm" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblVulva}</label>${chips('vulva_status', [{v:'Normal',l:t.optNormal},{v:'Small',l:t.optSmall},{v:'Upturned',l:t.optUpturned},{v:'NA',l:t.optNA}], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblTestis}</label>${chips('testis_status', [{v:'Symmetrical',l:t.optSym},{v:'Asymmetrical',l:t.optAsym},{v:'Small',l:t.optSmall},{v:'NA',l:t.optNA}], false)}</div>
        `;
      } else if (ft === 'treatment') {
        html += `
          <div class="field-block"><label class="field-label">${t.lblEarTag}</label><input type="text" id="f_ear_tag" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblMedOpt}</label>${chips('medication_option', [{v:'Reserved_1',l:t.optMedReserved}], false)}</div>
          <div class="field-block"><label class="field-label">${t.lblNote}</label><input type="text" id="f_brief_note" class="input-box" /></div>
        `;
      } else if (ft === 'mortality') {
        html += `
          <div class="field-block"><label class="field-label">${t.lblEarTag}</label><input type="text" id="f_ear_tag" class="input-box" /></div>
          <div class="field-block"><label class="field-label">${t.lblNote}</label><input type="text" id="f_brief_note" class="input-box" /></div>
        `;
      }

      html += `
        <button type="button" class="primary-btn" id="btnSendForm" onclick="sendForm()">${t.submitBtn}</button>
        <div id="stageTracker" class="stage-tracker hidden"></div>
      `;
      panel.innerHTML = html;
    }

    function setStageUI(el, cls, text) {
      el.className = 'stage-tracker ' + cls;
      el.classList.remove('hidden');
      el.textContent = text;
    }

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            const maxDim = CONFIG.MAX_IMG_PX;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ mimeType: 'image/jpeg', base64: c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY) });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function sendForm() {
      const t = DICT[state.lang];
      const btn = document.getElementById('btnSendForm');
      const stEl = document.getElementById('stageTracker');
      btn.disabled = true;
      setStageUI(stEl, 'st-prep', t.step1Prep);

      const data = {};
      document.querySelectorAll('#formPanel [id^="f_"]').forEach(el => {
        if (el.type === 'file') return;
        data[el.id.replace(/^f_/, '')] = el.value;
      });
      Object.keys(state.chips).forEach(k => { data[k] = state.chips[k]; });

      const ft = state.view.formType;
      let backendModule = 'daily_fw';
      if (ft === 'daily_fw') backendModule = 'daily_fw';
      else if (ft === 'conformation') backendModule = 'conformation';
      else if (ft === 'gestation') {
        backendModule = 'gestation';
        const nowTime = new Date().toTimeString().slice(0, 8);
        if (data.breeding_date) data.breeding_datetime_hidden = `${data.breeding_date} ${nowTime}`;
      } else if (ft.startsWith('farr_')) {
        backendModule = 'farrowing';
        data.sub_action = ft;
      } else if (ft === 'boar_semen') backendModule = 'boar_semen';
      else if (ft === 'malformation') backendModule = 'malformation_disease';
      else if (ft === 'treatment' || ft === 'mortality') {
        backendModule = 'treatment_mortality';
        data.event_type = ft;
      }

      let photo = null;
      const photoInput = document.getElementById('f_photo_file');
      if (photoInput && photoInput.files && photoInput.files[0]) {
        photo = await compressPhoto(photoInput.files[0]);
      }

      setStageUI(stEl, 'st-sending', t.step2Send);
      logTraj('submit:' + backendModule);

      const payload = {
        token: CONFIG.API_TOKEN,
        module: backendModule,
        common: {
          farm_mode: state.profile.group,
          wing: state.view.wing,
          room: state.view.room,
          location: [state.view.dept, state.view.wing, state.view.room].filter(Boolean).join(' / '),
          batch: state.currentBatch,
          module: backendModule
        },
        data: data,
        photo: photo,
        meta: {
          entered_at: state.enteredAt,
          submitted_at: new Date().toISOString(),
          dwell_seconds: Math.max(1, Math.round((Date.now() - state.enteredMs) / 1000)),
          ui_lang: state.lang,
          role_level: state.profile.level,
          device_summary: /mobile|android|iphone|ipad/i.test(navigator.userAgent) ? 'Mobile/Tablet' : 'Desktop',
          user_agent: navigator.userAgent,
          screen_info: window.screen.width + 'x' + window.screen.height + '@' + (window.devicePixelRatio || 1),
          trajectory_summary: state.trajectory.join(' -> '),
          offline_queued: false
        }
      };

      try {
        const res = await fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const j = await res.json();
        if (j && j.ok) {
          setStageUI(stEl, 'st-done', t.step3Done + (j.rowId || 'OK'));
          playAlertTone('success');
        } else {
          throw new Error(j && j.error ? j.error : 'ERR');
        }
      } catch (e) {
        payload.meta.offline_queued = true;
        const q = getQueue();
        q.push(payload);
        localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(q));
        refreshQueuePill();
        setStageUI(stEl, 'st-queued', t.step3Queued);
        playAlertTone('queued');
      }
      btn.disabled = false;
    }

    function getQueue() {
      try { return JSON.parse(localStorage.getItem(CONFIG.KEYS.QUEUE) || '[]'); }
      catch (e) { return []; }
    }

    function refreshQueuePill() {
      const q = getQueue();
      const el = document.getElementById('queuePill');
      if (q.length > 0) {
        el.textContent = q.length;
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    async function syncOfflineQueue() {
      const q = getQueue();
      if (!q.length) return;
      const keep = [];
      for (const item of q) {
        try {
          const res = await fetch(CONFIG.GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(item)
          });
          const j = await res.json();
          if (!j || !j.ok) keep.push(item);
        } catch (e) {
          keep.push(item);
        }
      }
      localStorage.setItem(CONFIG.KEYS.QUEUE, JSON.stringify(keep));
      refreshQueuePill();
    }

    window.addEventListener('online', syncOfflineQueue);

    (function init() {
      state.soundOn = localStorage.getItem(CONFIG.KEYS.SOUND) !== '0';
      state.lang = detectSystemLang();
      document.documentElement.lang = state.lang;
      document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
      applyTexts();
      updateClockAndForecastCurve();
      setInterval(updateClockAndForecastCurve, 1000);
      loadForecastWeather();
      refreshQueuePill();
      logTraj('init');

      const savedPass = localStorage.getItem(CONFIG.KEYS.PASS);
      if (savedPass) {
        const prof = parsePass(savedPass);
        if (prof) {
          state.profile = prof;
          openWorkspace();
        }
      }
    })();
    // === [END MODULE 4] ===
  </script>
